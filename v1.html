<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пошаговая игра 60x60</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0;
    padding: 10px;
    background: #121417;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .hud {
    width: 100%;
    max-width: 480px;
    background: #1c2128;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
  }
  .steps-box {
    font-size: 18px;
    font-weight: bold;
    color: #3fb950;
  }
  .steps-box.empty {
    color: #f85149;
  }
  .status-msg {
    width: 100%;
    max-width: 480px;
    text-align: center;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 8px;
    color: #8b949e;
  }
  .status-msg.warn {
    color: #ffa657;
    font-weight: bold;
  }
  canvas {
    background: #0d1117;
    border: 2px solid #30363d;
    border-radius: 6px;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    display: block;
    touch-action: manipulation;
  }
  .controls {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 68px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
    justify-content: center;
  }
  button {
    background: #21262d;
    color: #f0f6fc;
    border: 1px solid #30363d;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  button:active {
    background: #30363d;
    transform: scale(0.96);
  }
  button.disabled {
    opacity: 0.4;
  }
  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-skip {
    grid-column: 2;
    grid-row: 2;
    background: #1f6feb;
    border-color: #388bfd;
    font-size: 12px;
    line-height: 1.1;
    text-align: center;
    padding: 4px;
  }
  .btn-skip.highlight {
    background: #238636;
    border-color: #2ea043;
    box-shadow: 0 0 10px rgba(46, 160, 67, 0.6);
  }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>

<div class="hud">
  <div>Ход: <strong id="turnNum">1</strong></div>
  <div id="stepsDisplay" class="steps-box">Шаги: <span id="stepsLeft">6</span> / <span id="stepsMax">6</span></div>
  <div>X:<span id="posX">30</span> Y:<span id="posY">30</span></div>
</div>

<div id="statusMsg" class="status-msg">Выберите направление стрелками ниже</div>

<canvas id="gameCanvas" width="600" height="600"></canvas>

<div class="controls">
  <button class="btn-up" id="btnUp" aria-label="Вверх">▲</button>
  <button class="btn-left" id="btnLeft" aria-label="Влево">◄</button>
  <button class="btn-skip" id="btnSkip">ПРОПУСТИТЬ<br>ХОД</button>
  <button class="btn-right" id="btnRight" aria-label="Вправо">►</button>
  <button class="btn-down" id="btnDown" aria-label="Вниз">▼</button>
</div>

<script>
  const GRID_SIZE = 60;
  const BASE_STEPS = 6;

  let turn = 1;
  let steps = BASE_STEPS;
  let player = { x: 30, y: 30 };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const turnNumEl = document.getElementById('turnNum');
  const stepsLeftEl = document.getElementById('stepsLeft');
  const stepsMaxEl = document.getElementById('stepsMax');
  const stepsDisplayEl = document.getElementById('stepsDisplay');
  const posXEl = document.getElementById('posX');
  const posYEl = document.getElementById('posY');
  const statusMsgEl = document.getElementById('statusMsg');
  const btnSkip = document.getElementById('btnSkip');
  const dirButtons = [
    document.getElementById('btnUp'),
    document.getElementById('btnLeft'),
    document.getElementById('btnRight'),
    document.getElementById('btnDown')
  ];

  stepsMaxEl.textContent = BASE_STEPS;

  function draw() {
    const cellSize = canvas.width / GRID_SIZE;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#1c2128';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      const pos = i * cellSize;
      ctx.beginPath();
      ctx.moveTo(pos, 0);
      ctx.lineTo(pos, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, pos);
      ctx.lineTo(canvas.width, pos);
      ctx.stroke();
    }

    const cx = player.x * cellSize + cellSize / 2;
    const cy = player.y * cellSize + cellSize / 2;
    const radius = cellSize * 0.42;

    ctx.fillStyle = '#3fb950';
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function updateUI(message, isWarn) {
    turnNumEl.textContent = turn;
    stepsLeftEl.textContent = steps;
    posXEl.textContent = player.x + 1;
    posYEl.textContent = player.y + 1;

    if (steps === 0) {
      stepsDisplayEl.classList.add('empty');
      btnSkip.classList.add('highlight');
      dirButtons.forEach(b => b.classList.add('disabled'));
    } else {
      stepsDisplayEl.classList.remove('empty');
      btnSkip.classList.remove('highlight');
      dirButtons.forEach(b => b.classList.remove('disabled'));
    }

    if (message) {
      statusMsgEl.textContent = message;
      statusMsgEl.className = isWarn ? 'status-msg warn' : 'status-msg';
    }
  }

  function move(dx, dy) {
    if (steps <= 0) {
      updateUI('Шаги закончились! Нажмите «ПРОПУСТИТЬ ХОД»', true);
      return;
    }

    const nx = player.x + dx;
    const ny = player.y + dy;

    if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) {
      updateUI('Граница поля 60×60!', true);
      return;
    }

    player.x = nx;
    player.y = ny;
    steps -= 1;

    if (steps === 0) {
      updateUI('Шаги закончились! Нажмите «ПРОПУСТИТЬ ХОД»', true);
    } else {
      updateUI(`Осталось шагов: ${steps}`, false);
    }
    draw();
  }

  function skipTurn() {
    turn += 1;
    steps = BASE_STEPS;
    updateUI(`Начался ход ${turn}. Доступно шагов: ${steps}`, false);
    draw();
  }

  document.getElementById('btnUp').addEventListener('click', () => move(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => move(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => move(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => move(1, 0));
  btnSkip.addEventListener('click', skipTurn);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') move(0, -1);
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') move(0, 1);
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move(-1, 0);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move(1, 0);
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      skipTurn();
    }
  });

  updateUI(`Начался ход 1. Доступно шагов: ${steps}`, false);
  draw();
</script>
</body>
</html>
