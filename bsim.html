<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S-T-I-K-S // Симулятор боя (bsim v1.8.6)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d0c;
    color: #d6e5db;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.35;
    padding: 8px;
    max-width: 540px;
    margin: 0 auto;
  }
  .box {
    background: #111613;
    border: 1px solid #6e2626;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #5c2828;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .hdr b { color: #ff9e9e; font-size: 13px; }
  .badge {
    background: #2b1212;
    border: 1px solid #8f2d2d;
    color: #f5d6d6;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 6px; }
  label { display: block; font-size: 10px; color: #a87f7f; margin-bottom: 2px; }
  select, input {
    width: 100%;
    background: #080a09;
    color: #e6f2ea;
    border: 1px solid #4a1c1c;
    border-radius: 4px;
    padding: 5px;
    font-family: monospace;
    font-size: 11px;
  }
  .btn {
    background: #1b221e;
    color: #d6e5db;
    border: 1px solid #6e2626;
    border-radius: 4px;
    padding: 6px 8px;
    font-family: monospace;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #3b1515; border-color: #8f2d2d; color: #f5d6d6; font-weight: bold; }
  .btn-mana { background: #14263b; border-color: #2d6a8f; color: #b8dcff; font-weight: bold; }
  .btn-ok { background: #153322; border-color: #2e7d4f; color: #b6f5cf; font-weight: bold; }
  #combat-stage {
    position: relative;
    width: 100%;
    height: 195px;
    border: 1px solid #8f2d2d;
    border-radius: 6px;
    overflow: hidden;
    background: #090b0a;
    margin-bottom: 8px;
  }
  #stage-bg-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .dist-pill {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    background: rgba(10, 12, 11, 0.85);
    border: 1px solid #6e2626;
    color: #e6c86e;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    white-space: nowrap;
  }
  .fighters-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .fighter-card {
    position: absolute;
    bottom: 14px;
    width: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 0.45s ease, right 0.45s ease, transform 0.2s ease;
  }
  .portrait-wrap {
    position: relative;
    width: 58px;
    height: 68px;
    border: 2px solid #8f2d2d;
    border-radius: 5px;
    background: #140e0e;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .portrait-wrap.ally { border-color: #3d8b57; }
  .portrait-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .f-name {
    margin-top: 3px;
    font-size: 9px;
    background: rgba(8, 10, 9, 0.88);
    padding: 1px 4px;
    border-radius: 3px;
    color: #eef7f1;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }
  .f-hp-bar { width: 58px; height: 4px; background: #241212; border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .f-hp-fill { height: 100%; background: #e53935; transition: width 0.25s; }
  .f-hp-fill.ally { background: #4caf50; }
  .float-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .float-pop {
    position: absolute;
    transform: translate(-50%, 0);
    font-weight: bold;
    font-size: 13px;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    animation: popUp 1.15s ease-out forwards;
    white-space: nowrap;
  }
  .float-dmg { color: #ffffff; font-size: 14px; }
  .float-crit { color: #ff2a2a; font-size: 17px; letter-spacing: 0.5px; }
  .float-sfx { color: #ffd54f; font-size: 13px; font-style: italic; }
  .float-skill {
    color: #9be6ff;
    background: rgba(12, 22, 34, 0.88);
    border: 1px solid #3b7ea1;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10px;
  }
  @keyframes popUp {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(0.85); }
    18%  { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
    80%  { opacity: 1; transform: translate(-50%, -24px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -36px) scale(0.95); }
  }
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: #140e0e;
    border: 1px solid #4a1c1c;
    padding: 5px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-size: 10px;
  }
  .feed {
    background: #080908;
    border: 1px solid #3d1c1c;
    border-radius: 4px;
    padding: 6px;
    height: 150px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.4;
  }
  .feed-line { padding: 2px 0; border-bottom: 1px dashed #1f1212; }
</style>

    </div>
  </div>

      <label>Корневой Дар Улья (16)</label>
      <select id="sim-dar" onchange="BSIM_UI.syncBranches()"></select>
    </div>
    <div>
      <label>Ветка Дара (49)</label>
      <select id="sim-branch"></select>
    </div>
    <div>
      <label>Ур. Дара / Статы бойца</label>
      <div style="display:flex;gap:3px;">
        <select id="sim-darlvl" style="flex:1;">

          <option value="10">Дар Ур.10</option>
          <option value="20">Дар Ур.20</option>
          <option value="30" selected>Дар Ур.30</option>

          <option value="150">Статы 150</option>
          <option value="500">Статы 500</option>
        </select>
      </div>
    </div>
  </div>

    <button class="btn btn-ok" style="flex:2;" onclick="BSIM_UI.startSim()">🔄 Запустить / Перезапустить бой</button>
    <button class="btn btn-mana" style="flex:1;" onclick="BSIM_UI.refillMana()">🔮 Восполнить Ману (100%)</button>
  </div>
</div>

<div id="combat-stage">

  <div id="stage-fighters" class="fighters-layer"></div>

<div class="box">

</div>

      { id: 'b2', name: 'Грязь — это загар', mana1: 0, mana30: 0 },
      { id: 'b3', name: 'Танкам дорога не нужна', mana1: 50, mana30: 0 }
    ]},
    sense: { name: 'Сенс', pool: 'human', mana1: 50, mana30: 5, branches: [
      { id: 'b1', name: 'Чувствительность', mana1: 0, mana30: 0 },
      { id: 'b2', name: 'Знание сути', mana1: 50, mana30: 5 },
      { id: 'b3', name: 'Знаток восприятия', mana1: 50, mana30: 10 }
    ]},
    ice_master: { name: 'Мастер льда', pool: 'human', mana1: 50, mana30: 10, branches: [
      { id: 'b1', name: 'Ледяной панцирь', mana1: 50, mana30: 5 },
      { id: 'b2', name: 'Гололёд', mana1: 50, mana30: 10 },
      { id: 'b3', name: 'Хладнокровие', mana1: 0, mana30: 0 }
    ]},
    vaishnavism: { name: 'Приступ вайшнавизма', pool: 'infected', mana1: 0, mana30: 0, branches: [
      { id: 'b1', name: 'Харе Кришна, чувак!', mana1: 50, mana30: 10 },
      { id: 'b2', name: 'Человеческая суть', mana1: 40, mana30: 10 },
      { id: 'b3', name: 'Нечеловеческая предусмотрительность', mana1: 10, mana30: 1 }
    ]},
    gigantism: { name: 'Гигантизм', pool: 'infected', mana1: 0, mana30: 0, branches: [
      { id: 'b1', name: 'Танк (Гигант)', mana1: 25, mana30: 5 },
      { id: 'b2', name: 'Голод гиганта', mana1: 50, mana30: 10 },
      { id: 'b3', name: 'Чудовищная регенерация', mana1: 50, mana30: 10 }
    ]},
    hive_child: { name: 'Дитя Улья', pool: 'infected', mana1: 0, mana30: 0, branches: [
      { id: 'b1', name: 'Активная маскировка', mana1: 40, mana30: 10 },
      { id: 'b2', name: 'Родная среда', mana1: 30, mana30: 5 },
      { id: 'b3', name: 'Аура ужаса', mana1: 50, mana30: 10 }
    ]}
  },
  getSceneBgSvg(loc) {
    if (loc === 'park') {
      return '<rect width="400" height="195" fill="#0d1b14"/><circle cx="320" cy="40" r="20" fill="#274734"/><rect x="0" y="150" width="400" height="45" fill="#131915"/><circle cx="55" cy="95" r="28" fill="#183322"/><rect x="52" y="115" width="6" height="35" fill="#2b211a"/><circle cx="345" cy="90" r="30" fill="#183322"/><rect x="342" y="112" width="6" height="38" fill="#2b211a"/>';
    }
    if (loc === 'ruins') {
      return '<rect width="400" height="195" fill="#1b0e0e"/><polygon points="15,155 15,65 45,50 70,85 85,155" fill="#140d0d" stroke="#3b1d1d"/><polygon points="315,155 330,55 360,75 385,45 385,155" fill="#140d0d" stroke="#3b1d1d"/><rect x="0" y="150" width="400" height="45" fill="#120c0c"/>';
    }
    return '<rect width="400" height="195" fill="#0e141d"/><rect x="15" y="45" width="55" height="110" fill="#151d29" stroke="#283445"/><rect x="80" y="70" width="45" height="85" fill="#18212e" stroke="#283445"/><rect x="280" y="55" width="50" height="100" fill="#151d29" stroke="#283445"/><rect x="340" y="38" width="48" height="117" fill="#18212e" stroke="#283445"/><rect x="0" y="150" width="400" height="45" fill="#111317"/>';
  },
  getRankFallbackSvg(rank, isPlayer) {
    const r = Number(rank) || 0;
    const cols = ['#8c9ba5','#6ee794','#38bdf8','#818cf8','#facc15','#fb923c','#f87171','#e879f9','#ef4444','#ff1e56'];
    const c = isPlayer ? '#4ade80' : (cols[Math.min(9, Math.max(0, r))] || '#ef4444');
    const lbl = isPlayer ? 'ИГРОК' : ('Р.' + r);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#120d0d"/><circle cx="32" cy="22" r="11" fill="none" stroke="' + c + '" stroke-width="2.5"/><path d="M14 54 C14 39, 50 39, 50 54" fill="none" stroke="' + c + '" stroke-width="2.5"/><text x="32" y="61" text-anchor="middle" fill="' + c + '" font-size="9" font-family="monospace" font-weight="bold">' + lbl + '</text></svg>';
  }
};

window.STIKS_COMBAT_CORE = {
  state: null,
  calcMana(m1, m30, lvl) {
    if (!m1 && !m30) return 0;
    const ratio = (Math.max(1, Math.min(30, lvl)) - 1) / 29;
    return Math.max(0, Math.round(m1 - (m1 - m30) * ratio));
  },
  getMult(wCls, eRank) {
    const d = wCls - eRank;
    if (wCls === 2) return d > 0 ? 3 : (d === 0 ? 2 : (d === -1 ? 1.5 : 1));
    if (wCls === 3) return d > 0 ? 2 : (d === 0 ? 3 : 1);
    if (wCls >= 4 && d >= 0) return 3;
    return 1;
  },
  start(cfg) {
    const D = window.BSIM_DATA;
    const arch = D.ARCHETYPES[cfg.archKey] || D.ARCHETYPES.kachok;
    const zInfo = D.Z_RANKS.find(z => z.r === cfg.eRank) || D.Z_RANKS[2];
    const weap = D.WEAPONS[cfg.weapKey] || D.WEAPONS.gun_2;
    let img = arch.img || 'img/kachok.jpeg';
    if (cfg.archKey === 'psih') img = cfg.sex === 'f' ? arch.imgF : arch.imgM;
    if (cfg.archKey === 'kvaz') img = cfg.sex === 'f' ? arch.imgF : arch.imgM;
    const maxMana = Math.max(100, 10 + cfg.stat * 2);
    const infHp = 1000000;
    const enemies = [];
    for (let i = 0; i < cfg.eCount; i++) {
      enemies.push({
        id: 'en_' + i,
        name: cfg.eCount > 1 ? zInfo.name + ' #' + (i + 1) : zInfo.name,
        rank: zInfo.r,
        hp: infHp,
        maxHp: infHp,
        agi: zInfo.agi,
        dmg: zInfo.dmg,
        sound: zInfo.sound,
        stun: 0
      });
    }
    const dist = weap.isGun ? Math.max(1, 2 + (weap.cls - zInfo.r)) : 0;
    this.state = {
      loc: cfg.loc,
      round: 1,
      dist: dist,
      maxDist: Math.max(1, dist),
      player: {
        name: arch.name,
        archKey: cfg.archKey,
        img: img,
        hp: infHp,
        maxHp: infHp,
        mana: maxMana,
        maxMana: maxMana,
        stat: cfg.stat,
        weap: weap,
        armCls: cfg.armCls,
        armFlat: D.ARMOR_FLAT[cfg.armCls] || 0,
        skill: arch.skill,
        phrase: arch.phrase,
        darKey: cfg.darKey,
        branchKey: cfg.branchKey,
        darLvl: cfg.darLvl,
        shield: 0,
        buff: 1
      },
      enemies: enemies
    };
    return this.state;
  }
};

window.BSIM_UI = {
  init() {
    const D = window.BSIM_DATA;
    const aSel = document.getElementById('sim-arch');
    if (aSel) {
      aSel.innerHTML = Object.keys(D.ARCHETYPES).map(k => '<option value="' + k + '">' + D.ARCHETYPES[k].name + '</option>').join('');
      aSel.value = 'kachok';
    }
    const eSel = document.getElementById('sim-erank');
    if (eSel) {
      eSel.innerHTML = D.Z_RANKS.map(z => '<option value="' + z.r + '">Р.' + z.r + ' ' + z.name + '</option>').join('');
      eSel.value = '2';
    }
    const dSel = document.getElementById('sim-dar');
    if (dSel) {
      dSel.innerHTML = '<option value="">-- Без Дара --</option>' + Object.keys(D.DARS).map(k => '<option value="' + k + '">' + D.DARS[k].name + '</option>').join('');
      dSel.value = 'ice_master';
    }
    this.syncBranches();
    this.startSim();
  },
  syncBranches() {
    const D = window.BSIM_DATA;
    const dKey = (document.getElementById('sim-dar') || {}).value || '';
    const bSel = document.getElementById('sim-branch');
    if (!bSel) return;
    if (!dKey || !D.DARS[dKey]) {
      bSel.innerHTML = '<option value="">-- Нет ветки --</option>';
      return;
    }
    bSel.innerHTML = D.DARS[dKey].branches.map(b => '<option value="' + b.id + '">' + b.name + '</option>').join('');
  },
  changeLoc() {
    const loc = (document.getElementById('sim-loc') || {}).value || 'city';
    const svg = document.getElementById('stage-bg-svg');
    if (svg) svg.innerHTML = window.BSIM_DATA.getSceneBgSvg(loc);
  },
  startSim() {
    const cfg = {
      loc: (document.getElementById('sim-loc') || {}).value || 'city',
      archKey: (document.getElementById('sim-arch') || {}).value || 'kachok',
      sex: (document.getElementById('sim-sex') || {}).value || 'm',
      weapKey: (document.getElementById('sim-weap') || {}).value || 'gun_2',
      armCls: Number((document.getElementById('sim-armor') || {}).value) || 2,
      eRank: Number((document.getElementById('sim-erank') || {}).value) || 2,
      eCount: Number((document.getElementById('sim-ecount') || {}).value) || 2,
      darKey: (document.getElementById('sim-dar') || {}).value || '',
      branchKey: (document.getElementById('sim-branch') || {}).value || '',
      darLvl: Number((document.getElementById('sim-darlvl') || {}).value) || 30,
      stat: Number((document.getElementById('sim-stat') || {}).value) || 50
    };
    window.STIKS_COMBAT_CORE.start(cfg);
    const feed = document.getElementById('sim-feed');
    if (feed) feed.innerHTML = '';
    this.changeLoc();
    this.render();
    this.log('⚔️ Бой запущен! ОЗ всех участников: <b>1 000 000+ HP</b>.');
  },
  refillMana() {
    const st = window.STIKS_COMBAT_CORE.state;
    if (!st) return;
    st.player.mana = st.player.maxMana;
    this.pop('f-player', '🔮 Мана 100%', 'float-skill');
    this.log('🔮 Мана мгновенно восстановлена до 100% (' + st.player.mana + ').');
    this.render();
  },
  log(html) {
    const feed = document.getElementById('sim-feed');
    if (!feed) return;
    const d = document.createElement('div');
    d.className = 'feed-line';
    d.innerHTML = html;
    feed.appendChild(d);
    feed.scrollTop = feed.scrollHeight;
  },
  pop(cardId, txt, cls) {
    const layer = document.getElementById('stage-floats');
    const card = document.getElementById(cardId);
    if (!layer || !card) return;
    const el = document.createElement('div');
    el.className = 'float-pop ' + cls;
    el.textContent = txt;
    el.style.left = (card.offsetLeft + 34) + 'px';
    el.style.top = (card.offsetTop - 8) + 'px';
    layer.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 1150);
  },
  render() {
    const st = window.STIKS_COMBAT_CORE.state;
    if (!st) return;
    const D = window.BSIM_DATA;
    const p = st.player;
    const ratio = st.maxDist > 0 ? (st.dist / st.maxDist) : 0;
    const pLeft = Math.round(6 + (1 - ratio) * 24);
    const fLayer = document.getElementById('stage-fighters');
    if (fLayer) {
      const pFb = encodeURIComponent(D.getRankFallbackSvg(0, true));
      let html = '<div id="f-player" class="fighter-card" style="left:' + pLeft + '%;"><div class="portrait-wrap ally"><img src="' + p.img + '" onerror="this.onerror=null;this.src=\'data:image/svg+xml;utf8,' + pFb + '\';"></div><div class="f-name">' + p.name + '</div><div class="f-hp-bar"><div class="f-hp-fill ally" style="width:100%;"></div></div></div>';
      st.enemies.forEach((en, idx) => {
        const eRight = Math.round(6 + (1 - ratio) * 24 + idx * 14);
        const eFb = encodeURIComponent(D.getRankFallbackSvg(en.rank, false));
        html += '<div id="f-' + en.id + '" class="fighter-card" style="right:' + eRight + '%;"><div class="portrait-wrap"><img src="data:image/svg+xml;utf8,' + eFb + '"></div><div class="f-name">' + en.name + '</div><div class="f-hp-bar"><div class="f-hp-fill" style="width:100%;"></div></div></div>';
      });
      fLayer.innerHTML = html;
    }
    const distEl = document.getElementById('stage-dist');
    if (distEl) distEl.textContent = st.dist <= 0 ? 'Раунд ' + st.round + ' • Ближний бой (вплотную)' : 'Раунд ' + st.round + ' • Дистанция: ' + st.dist + ' кл.';
    const bars = document.getElementById('sim-bars');
    if (bars) {
      bars.innerHTML = '<div>❤️ ОЗ: <b>' + p.hp.toLocaleString('ru-RU') + '</b></div><div>🔮 Мана: <b>' + p.mana + '/' + p.maxMana + '</b></div><div>🛡️ Броня: <b>' + p.armFlat + ' (Р' + p.armCls + ')</b></div>';
    }
  },
  actAttack() {
    const st = window.STIKS_COMBAT_CORE.state;
    if (!st) return;
    const p = st.player;
    const trg = st.enemies[0];
    const d1 = Math.floor(Math.random() * 6) + 1;
    const d2 = Math.floor(Math.random() * 6) + 1;
    const crit = (d1 === d2) || (Math.random() < 0.2);
    const mult = window.STIKS_COMBAT_CORE.getMult(p.weap.cls, trg.rank);
    let dmg = Math.max(1, Math.round((p.weap.dmg + (d1 + d2) * 2 + p.stat * 0.4) * mult * p.buff));
    if (crit) dmg = Math.round(dmg * 1.75);
    trg.hp = Math.max(1, trg.hp - dmg);
    this.pop('f-player', p.weap.sound, 'float-sfx');
    this.pop('f-' + trg.id, '-' + dmg + (crit ? ' КРИТ!' : ''), crit ? 'float-crit' : 'float-dmg');
    this.log(p.weap.sound + ' <b>' + p.name + '</b> [' + d1 + '+' + d2 + '] → <b>' + trg.name + '</b>: <b>-' + dmg + '</b>' + (crit ? ' <span style="color:#ff4444;">(КРИТ!)</span>' : ''));
    this.endRound();
  },
  actSkill() {
    const st = window.STIKS_COMBAT_CORE.state;
    if (!st) return;
    const p = st.player;
    const trg = st.enemies[0];
    const dmg = Math.round((p.weap.dmg * 1.6 + p.stat * 0.9) * p.buff);
    trg.hp = Math.max(1, trg.hp - dmg);
    trg.stun = 1;
    this.pop('f-player', '✨ ' + p.skill, 'float-skill');
    this.pop('f-' + trg.id, '-' + dmg + ' КРИТ!', 'float-crit');
    this.log('✨ Навык <b>[' + p.skill + ']</b> («' + p.phrase + '») → <b>-' + dmg + '</b> + оглушение!');
    this.endRound();
  },
  actDarBase() { this.castDar(false); },
  actDarBranch() { this.castDar(true); },
  castDar(isBranch) {
    const st = window.STIKS_COMBAT_CORE.state;
    const D = window.BSIM_DATA;
    if (!st || !st.player.darKey || !D.DARS[st.player.darKey]) return;
    const p = st.player;
    const dar = D.DARS[p.darKey];
    const br = isBranch ? (dar.branches.find(b => b.id === p.branchKey) || dar.branches[0]) : null;
    const title = br ? br.name : dar.name;
    const pct = window.STIKS_COMBAT_CORE.calcMana(br ? br.mana1 : dar.mana1, br ? br.mana30 : dar.mana30, p.darLvl);
    const cost = Math.floor(p.maxMana * (pct / 100));
    if (p.mana < cost) {
      this.pop('f-player', '❌ Мало маны!', 'float-crit');
      this.log('❌ Не хватает маны на <b>[' + title + ']</b> (нужно ' + cost + ', есть ' + p.mana + '). Нажмите кнопку маны!');
      return;
    }
    p.mana -= cost;
    const dmg = Math.round((70 + p.stat * 1.1) * (1 + p.darLvl * 0.08));
    st.enemies.forEach(en => {
      en.hp = Math.max(1, en.hp - dmg);
      this.pop('f-' + en.id, '-' + dmg + ' КРИТ!', 'float-crit');
    });
    this.pop('f-player', (isBranch ? '🌿 ' : '🧬 ') + title, 'float-skill');
    this.log((isBranch ? '🌿 Ветка' : '🧬 Дар') + ' <b>[' + title + ']</b> (Ур.' + p.darLvl + ', -' + cost + ' маны): урон по всем <b>-' + dmg + '</b>!');
    this.endRound();
  },
  endRound() {
    const st = window.STIKS_COMBAT_CORE.state;
    const p = st.player;
    if (st.dist > 0) {
      st.dist = Math.max(0, st.dist - 1);
      this.log('🏃 Враги сближаются → дистанция <b>' + st.dist + ' кл.</b>');
    } else {
      st.enemies.forEach(en => {
        if (en.stun > 0) { en.stun--; this.log('💫 <b>' + en.name + '</b> оглушён.'); return; }
        const dmg = Math.max(1, en.dmg - p.armFlat);
        p.hp = Math.max(1, p.hp - dmg);
        this.pop('f-' + en.id, en.sound, 'float-sfx');
        this.pop('f-player', '-' + dmg, 'float-dmg');
        this.log(en.sound + ' <b>' + en.name + '</b> бьёт: <b>-' + dmg + '</b> (броня -' + p.armFlat + ').');
      });
    }
    st.round++;
    this.render();
  }
};

window.BSIM_UI.init();
</script>
