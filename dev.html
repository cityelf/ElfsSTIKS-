<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S-T-I-K-S // DEV</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { background: #0b0d0c; color: #c8d6cc; font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
    .wrapper { max-width: 520px; margin: 0 auto; background: #131715; border: 1px solid #6e2626; padding: 12px; border-radius: 6px; }
    h1 { font-size: 15px; text-align: center; color: #d68a8a; margin: 0 0 6px 0; border-bottom: 1px solid #6e2626; padding-bottom: 6px; }
    .btn { background: #1e2622; color: #c8d6cc; border: 1px solid #6e2626; padding: 8px 6px; font-family: inherit; font-size: 11px; cursor: pointer; flex: 1; text-align: center; border-radius: 4px; touch-action: manipulation; }
    .btn:active { background: #3b1515; transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #3b1515; border-color: #8f2d2d; color: #f5d6d6; font-weight: bold; }
    .btn-danger { background: #2b1414; border-color: #5c2828; color: #d68585; }
    .top-controls { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .patch-badge { font-size: 10px; color: #98d4ae; text-align: right; margin-bottom: 6px; }
    #game-viewport { min-height: 290px; background: #0e1210; border: 1px solid #6e2626; padding: 10px; border-radius: 4px; }
    .hud { display: flex; justify-content: space-between; align-items: center; background: #140e0e; border: 1px solid #6e2626; padding: 6px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 11px; }
    .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #140e0e; padding: 5px 6px; border: 1px solid #6e2626; border-radius: 4px; margin-bottom: 8px; font-size: 10.5px; }
    .grid11 { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; background: #080a09; padding: 4px; border: 1px solid #6e2626; margin-bottom: 8px; }
    .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #131815; color: #687a6e; font-size: 12px; border-radius: 2px; }
    .cell.me { background: #2d4a38; color: #fff; font-weight: bold; }
    .cell.wall { background: #1f2421; }
    .cell.loot { background: #18242b; color: #7ab8e6; }
    .cell.val { background: #241c30; color: #c49eff; }
    .cell.zomb { background: #3b1818; color: #ff7a7a; }
    .cell.hum { background: #2b2614; color: #e6c86e; }
    .cell.exit { background: #132419; border: 1px dashed #3d8b57; color: #6ee794; }
    .modes { display: flex; gap: 4px; margin-bottom: 8px; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
    .log-box { margin-top: 10px; background: #070908; border: 1px solid #3d1c1c; padding: 8px; font-size: 11px; max-height: 125px; overflow-y: auto; color: #b5a3a3; line-height: 1.35; }
    input, select { background: #080a09; color: #e6f2ea; border: 1px solid #4a1c1c; border-radius: 4px; padding: 5px; font-family: inherit; font-size: 11px; user-select: auto; -webkit-user-select: auto; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>S-T-I-K-S // УЛЕЙ (DEV)</h1>
    <div id="patch-status" class="patch-badge">Загрузка модулей...</div>
    <div class="top-controls">
      <button id="btn-voice-toggle" type="button" class="btn" onclick="STIKS.toggleVoice()">🔊 Голос: ВКЛ</button>
      <button id="btn-export-save" type="button" class="btn btn-primary" onclick="STIKS.exportSave()">💾 Сейв</button>
      <button type="button" class="btn" onclick="document.getElementById('inp-import-save').click()">📂 Загрузить</button>
      <input type="file" id="inp-import-save" accept=".json,.txt,application/json" style="display:none;" onchange="STIKS.importSave(this.files && this.files.at(0))">
    </div>
    <div id="game-viewport"></div>
    <div id="sys-log" class="log-box">&gt; Инициализация чистого ядра...</div>
  </div>

  <script>
    (function() {
      const ts = Date.now();
      function loadScript(src) {
        return new Promise(function(resolve) {
          const s = document.createElement('script');
          s.src = src + '?v=' + ts;
          s.onload = resolve;
          s.onerror = resolve;
          document.body.appendChild(s);
        });
      }

      loadScript('stiks_content.js').then(function() {
        return loadScript('zopa.js');
      }).then(function() {
        const badge = document.getElementById('patch-status');
        const STIKS = window.STIKS;
        if (!STIKS) {
          if (badge) badge.innerText = '❌ Ошибка: zopa.js не загружен';
          return;
        }

        if (typeof STIKS.toggleVoice !== 'function') {
          STIKS.toggleVoice = function() {
            this.voiceOn = !this.voiceOn;
            const btn = document.getElementById('btn-voice-toggle');
            if (btn) btn.textContent = this.voiceOn ? '🔊 Голос: ВКЛ' : '🔇 Голос: ВЫКЛ';
            if (!this.voiceOn && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
          };
        }

        if (window.STIKS_CONTENT && typeof window.STIKS_CONTENT.applyToEngines === 'function') {
          window.STIKS_CONTENT.applyToEngines();
        }

        // ============================================================================
        // МОСТ К БОЕВОМУ СИМУЛЯТОРУ BSIM_DEV.HTML ДЛЯ ВТОРОГО ЯДРА
        // ============================================================================
        STIKS.openBsimDevCombat = function(p, enemies, zId) {
          const s = this.db && this.db.session;
          if (!s || !p) return;
          const isInf = Boolean((p.asInfected || p.isInfected) && !p.isKvaz);
          const archKey = p.isKvaz ? 'kvaz' : (isInf ? 'infected' : (p.arch || 'kachok'));
          const payload = {
            mode: 'game',
            zId: zId,
            diffKey: s.diffKey || 'start',
            player: {
              uid: p.uid,
              family: p.family,
              name: p.name,
              sex: p.sex || 'm',
              archKey: archKey,
              lvl: Number(p.lvl) || 0,
              hp: Number(p.hp) || 14,
              maxHp: Number(p.maxHp) || 14,
              mana: Number(p.mana) || 20,
              maxMana: Number(p.maxMana) || 20,
              stats: Object.assign({}, p.stats || {}),
              slots: Object.assign({}, p.slots || {}),
              gifts: Object.assign({}, p.gifts || {}),
              img: typeof this.resolvePortrait === 'function' ? this.resolvePortrait(p) : ''
            },
            enemies: enemies || []
          };
          try {
            localStorage.setItem('stiks_bsim_dev_bridge', JSON.stringify(payload));
            localStorage.removeItem('stiks_bsim_dev_result');
          } catch (e) {}

          const old = document.getElementById('stiks-bsim-dev-overlay');
          if (old) old.remove();

          const ov = document.createElement('div');
          ov.id = 'stiks-bsim-dev-overlay';
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(4,5,5,0.96);z-index:9900;display:flex;flex-direction:column;padding:6px;';
          ov.innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center;background:#140e0e;border:1px solid #8f2d2d;padding:6px 8px;border-radius:6px 6px 0 0;font-size:11px;">' +
            '<b style="color:#ff9e9e;">⚔️ БОЕВОЙ МОДУЛЬ (bsim_dev.html)</b>' +
            '<button type="button" class="btn btn-primary" style="flex:0 0 auto;padding:4px 10px;" onclick="STIKS.finishBsimDevCombat()">Завершить и вернуть в рейд ▶</button>' +
            '</div>' +
            '<iframe id="stiks-bsim-dev-frame" src="bsim_dev.html?bridge=1&v=' + Date.now() + '" style="flex:1;width:100%;border:1px solid #8f2d2d;border-top:none;border-radius:0 0 6px 6px;background:#0b0d0c;"></iframe>';
          document.body.appendChild(ov);
        };

        STIKS.finishBsimDevCombat = function() {
          const s = this.db && this.db.session;
          const ov = document.getElementById('stiks-bsim-dev-overlay');
          let res = null;
          try {
            res = JSON.parse(localStorage.getItem('stiks_bsim_dev_result') || 'null');
            localStorage.removeItem('stiks_bsim_dev_result');
          } catch (e) {}

          if (ov) ov.remove();
          if (!s) return;

          const p = s.players[Number(s.activeIdx) || 0];
          const combatInfo = s.combat || {};
          s.combat = null;
          if (window.STIKS_COMBAT_CORE) window.STIKS_COMBAT_CORE.state = null;

          if (res && res.player && p) {
            if (typeof res.player.hp === 'number') p.hp = Math.max(0, Math.min(p.maxHp, Math.round(res.player.hp)));
            if (typeof res.player.mana === 'number') p.mana = Math.max(0, Math.min(p.maxMana, Math.round(res.player.mana)));
            if (res.player.stats) p.stats = Object.assign({}, p.stats, res.player.stats);
            if (typeof this.recalcLevel === 'function') this.recalcLevel(p);
            if (typeof this.normalizePlayerStats === 'function') this.normalizePlayerStats(p);
          }

          if (res && res.victory) {
            if (typeof this._onBsimVictory === 'function') {
              this._onBsimVictory({
                zId: combatInfo.zId,
                enemies: res.enemies || combatInfo.enemies || [],
                player: { heroRef: p, hp: p.hp, mana: p.mana }
              });
            }
          } else if (res && res.defeat) {
            if (typeof this._onBsimDefeat === 'function') {
              this._onBsimDefeat({
                zId: combatInfo.zId,
                enemies: combatInfo.enemies || [],
                player: { heroRef: p, hp: 0, mana: p.mana }
              });
            }
          } else if (p && typeof this.syncHeroProfile === 'function') {
            this.syncHeroProfile(p);
          }

          this.saveDB();
          this.renderGame();
        };

        window.addEventListener('message', function(ev) {
          if (ev && ev.data && ev.data.type === 'STIKS_BSIM_DEV_DONE') {
            try { localStorage.setItem('stiks_bsim_dev_result', JSON.stringify(ev.data.payload || {})); } catch (e) {}
            STIKS.finishBsimDevCombat();
          }
        });

        STIKS.renderCombat = function() {
          const s = this.db && this.db.session;
          if (!s || !s.combat) return;
          const p = s.players[Number(s.activeIdx) || 0];
          this.openBsimDevCombat(p, s.combat.enemies || [], s.combat.zId);
        };

        // ============================================================================
        // ПРЯМОЙ ДВИЖОК ДВИЖЕНИЯ 60x60 И ОБЫСКА, ПОДКЛЮЧЕННЫЙ К БАЗЕ STIKS.DB
        // ============================================================================
        window.DEV_MOVE = {
          getActive() {
            const s = STIKS.db && STIKS.db.session;
            if (!s || !Array.isArray(s.players) || !s.players.length) return null;
            const idx = Math.max(0, Math.min(s.players.length - 1, Number(s.activeIdx) || 0));
            s.activeIdx = idx;
            const p = s.players[idx];
            if (!p) return null;
            if (typeof STIKS.normalizePlayerStats === 'function') STIKS.normalizePlayerStats(p);
            const spd = Number(p.stats && p.stats.spd) || 10;
            const tow = (p.towingCar ? (Number(p.towingCar.towPen) || 1) : 0) + (p.carryingCrown ? (Number(p.carryingCrown.towPen) || 1) : 0);
            p.maxAp = Math.max(1, 6 + Math.floor(spd / 50) - tow);
            if (typeof p.stepsLeft !== 'number' || isNaN(p.stepsLeft) || (Number(s.turn) === 1 && !p.movedThisTurn && p.stepsLeft <= 0)) {
              p.stepsLeft = p.maxAp;
            }
            p.x = Number(p.x) || 0;
            p.y = Number(p.y) || 0;
            return { s: s, p: p };
          },

          cost(p) {
            const m = (p && p.moveMode) || 'careful';
            const base = m === 'careful' ? 3 : (m === 'fast' ? 2 : 1);
            const ci = typeof STIKS.getCarryInfo === 'function' ? STIKS.getCarryInfo(p) : null;
            if (ci && ci.blocked) return 999;
            return (ci && ci.mult > 1) ? Math.ceil(base * ci.mult) : base;
          },

          setMode(m) {
            const cur = this.getActive();
            if (!cur) return;
            if (cur.p.movedThisTurn) {
              STIKS.log('❌ Нельзя менять скорость после шага в этом ходу.');
              return;
            }
            cur.p.moveMode = m;
            STIKS.saveDB();
            STIKS.renderGame();
          },

          move(dx, dy) {
            const cur = this.getActive();
            if (!cur) return;
            const s = cur.s, p = cur.p;
            if (s.combat && !document.getElementById('stiks-bsim-dev-overlay')) s.combat = null;
            if (s.combat || s.humanEncounter) return;

            const nx = p.x + dx, ny = p.y + dy;
            if (nx < 0 || nx > 59 || ny < 0 || ny > 59) {
              STIKS.stepPlayer(dx, dy);
              return;
            }

            const c = this.cost(p);
            if (c >= 999) { STIKS.log('🎒 Перегруз (>150%)! Шаг невозможен.'); return; }
            if (p.stepsLeft < c) { STIKS.log('❌ Нужно ' + c + ' ОХ, осталось ' + p.stepsLeft + '/' + p.maxAp + '.'); return; }

            const cell = s.grid && s.grid[ny] && s.grid[ny][nx];
            if (!cell) return;
            if (cell.blocked) { STIKS.log('⛰️ Преграда: ' + (cell.bType || 'стена') + '.'); return; }

            p.x = nx;
            p.y = ny;
            p.stepsLeft = Math.max(0, p.stepsLeft - c);
            p.movedThisTurn = true;
            s.pendingSpores = 0;

            if (typeof STIKS.playStepSound === 'function') STIKS.playStepSound(p.moveMode || 'careful');
            if (typeof STIKS.grantActionXp === 'function') {
              STIKS.grantActionXp(p, p.moveMode === 'run' ? 'spd' : (p.moveMode === 'careful' ? 'agi' : 'end'), 0.25);
            }
            STIKS.log('🚶 Шаг [' + (p.x + 1) + ':' + (p.y + 1) + '] (-' + c + ' ОХ, ост. ' + p.stepsLeft + '/' + p.maxAp + ').');

            const loud = Boolean(p.towingCar || p.carryingCrown || p.stinkTurns > 0);
            if (Array.isArray(s.zombies)) {
              if (p.moveMode === 'run' || loud) {
                const rad = loud ? 4 : 3;
                s.zombies.forEach(function(z) {
                  if (z && Math.abs(z.x - nx) <= rad && Math.abs(z.y - ny) <= rad) { z.hidden = false; z.tPos = { x: nx, y: ny }; }
                });
              }
              if ((p.moveMode || 'careful') === 'careful') {
                s.zombies.forEach(function(z) {
                  if (z && z.hidden && Math.abs(z.x - nx) <= 2 && Math.abs(z.y - ny) <= 2) z.hidden = false;
                });
              }
              const zHit = s.zombies.find(function(z) { return z && Number(z.x) === nx && Number(z.y) === ny; });
              if (zHit && !p.mapStealthOn && typeof STIKS.triggerEncounter === 'function') {
                zHit.hidden = false;
                STIKS.triggerEncounter(p, zHit);
                return;
              }
            }

            if (cell.lootType) STIKS.log('👀 Замечено ценное место. Нажмите «🔍 Поиск (3)».');
            STIKS.saveDB();
            STIKS.renderGame();
          },

          search() {
            if (typeof STIKS.searchCell === 'function') STIKS.searchCell(false);
          }
        };

        STIKS.renderGame = function() {
          if (typeof this.ensureStaticLabels === 'function') this.ensureStaticLabels();
          const vp = document.getElementById('game-viewport');
          const cur = window.DEV_MOVE.getActive();
          if (!vp || !cur) return;
          const s = cur.s, p = cur.p;
          if (s.combat) {
            if (this.ambientAudio) this.ambientAudio.stop();
            this.renderCombat();
            return;
          }
          if (this.ambientAudio && !this.lobbyPaused) this.ambientAudio.playMode('raid');

          const isInf = Boolean((p.asInfected || p.isInfected) && !p.isKvaz);
          const aInfo = this.getArchMeta(p.isKvaz ? 'kvaz' : (isInf ? 'infected' : p.arch));
          const carry = this.getCarryInfo(p);
          const stepCost = window.DEV_MOVE.cost(p);
          const skillLabel = isInf ? '☣️ Инстинкты Улья' : (this.isRealSkillUnlocked(p) ? ('✨ ' + aInfo.skill) : '🤪 Что-то учудить');
          const sporeLabel = this.isRealSporeUnlocked(p) ? '☣️ Споры:' : '🤒 Недуг:';
          const bIcons = { 'Скала': '⛰️', 'Водоем': '🌊', 'Руины': '🏚️', 'Обрыв': '🕳️', 'Пожар': '🔥' };
          const lIcons = { weapon: '🔫', armor: '🛡️', supply: '🎒', azamat: '🍳' };

          let gridHtml = '';
          for (let dy = -5; dy <= 5; dy++) {
            for (let dx = -5; dx <= 5; dx++) {
              const gx = p.x + dx, gy = p.y + dy;
              if (dx === 0 && dy === 0) {
                const meSym = p.towingCar ? (p.towingCar.ico || '🚗') : (p.carryingCrown ? '👑' : (isInf ? '☣️' : '🧍'));
                gridHtml += '<div class="cell me">' + meSym + '</div>';
              } else if (gx < 0 || gx > 59 || gy < 0 || gy > 59) {
                gridHtml += '<div class="cell exit">🚪</div>';
              } else {
                const cell = s.grid[gy][gx];
                const zHere = Array.isArray(s.zombies) && s.zombies.find(function(z) { return z && Number(z.x) === gx && Number(z.y) === gy && !z.hidden; });
                const pHere = s.players.find(function(pl) { return pl && pl.uid !== p.uid && Number(pl.x) === gx && Number(pl.y) === gy && !pl.dead && !pl.escaped; });
                if (pHere) gridHtml += '<div class="cell me">🧍</div>';
                else if (zHere) gridHtml += '<div class="cell ' + (zHere.isHuman ? 'hum' : 'zomb') + '">' + (zHere.isHuman ? '🧑' : '🧟') + '</div>';
                else if (cell.blocked) gridHtml += '<div class="cell wall">' + (bIcons[cell.bType] || '⛰️') + '</div>';
                else if (cell.isAzamatEaster) gridHtml += '<div class="cell val">🍳</div>';
                else if (cell.lootType) gridHtml += '<div class="cell ' + (cell.valuable ? 'val' : 'loot') + '">' + (cell.valuable ? '💎' : (lIcons[cell.lootType] || '📦')) + '</div>';
                else gridHtml += '<div class="cell"></div>';
              }
            }
          }

          const zOnCell = Array.isArray(s.zombies) && s.zombies.find(function(z) { return z && Number(z.x) === p.x && Number(z.y) === p.y; });
          const mode = p.moveMode || 'careful';

          let h = '<div class="hud">' +
            '<div><b>' + p.family + ' ' + p.name + '</b> (Ур.' + (p.lvl || 0) + ')</div>' +
            '<div>Ход:' + s.turn + ' | ОХ:<b>' + p.stepsLeft + '/' + p.maxAp + '</b> <span style="color:#fbbf24;">(шаг:' + stepCost + ')</span></div>' +
            '<div>[' + (p.x + 1) + ':' + (p.y + 1) + '] <button type="button" class="btn" style="padding:2px 6px;font-size:10px;" onclick="STIKS.pauseToLobby()">🏕</button></div>' +
            '</div>' +
            '<div class="bars">' +
            '<div>❤️ ОЗ: <b>' + p.hp + '/' + p.maxHp + '</b></div><div>🍖 Сыт: <b>' + p.food + '</b></div><div>💧 Жаж: <b>' + p.water + '</b></div>' +
            '<div>⚡ Бодр: <b>' + p.stamina + '</b></div><div>' + sporeLabel + ' <b>' + Math.round(p.spore || 0) + '</b></div><div>🔮 Мана: <b>' + p.mana + '/' + p.maxMana + '</b></div>' +
            '</div>' +
            '<div class="grid11">' + gridHtml + '</div>';

          if (zOnCell) {
            h += '<button type="button" class="btn btn-danger" style="width:100%;margin-bottom:8px;font-weight:bold;" onclick="STIKS.attackCurrentCell()">⚔️ Напасть на цель на клетке</button>';
          }

          h += '<div class="modes">' +
            '<button type="button" class="btn ' + (mode === 'careful' ? 'btn-primary' : '') + '" onclick="DEV_MOVE.setMode('careful')">Внимат. (3)</button>' +
            '<button type="button" class="btn ' + (mode === 'fast' ? 'btn-primary' : '') + '" onclick="DEV_MOVE.setMode('fast')">Быстро (2)</button>' +
            '<button type="button" class="btn ' + (mode === 'run' ? 'btn-primary' : '') + '" onclick="DEV_MOVE.setMode('run')">Бегом (1)</button>' +
            '</div>' +
            '<div class="pad">' +
            '<div></div><button type="button" class="btn" onclick="DEV_MOVE.move(0, -1)">⬆</button><div></div>' +
            '<button type="button" class="btn" onclick="DEV_MOVE.move(-1, 0)">⬅</button>' +
            '<button type="button" class="btn btn-primary" onclick="DEV_MOVE.search()">🔍 Поиск (3)</button>' +
            '<button type="button" class="btn" onclick="DEV_MOVE.move(1, 0)">➡</button>' +
            '<div></div><button type="button" class="btn" onclick="DEV_MOVE.move(0, 1)">⬇</button><div></div>' +
            '</div>' +
            '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:6px;">' +
            '<button type="button" class="btn" onclick="STIKS.toggleInv()">🎒 Вещи (' + p.inv.length + ' • ' + carry.rawPct + '%)</button>' +
            '<button type="button" class="btn" onclick="STIKS.useWeirdSkill()">' + skillLabel + '</button>' +
            '<button type="button" class="btn" onclick="STIKS.toggleProfile()">👤 Параметры</button>' +
            '<button type="button" class="btn btn-primary" onclick="STIKS.nextTurn()">⏭ Конец хода</button>' +
            '</div>';

          if (typeof this.renderMapGiftsBar === 'function') h += this.renderMapGiftsBar(p);
          if (typeof this.renderGameExtras === 'function') h += this.renderGameExtras(p, s, aInfo);
          vp.innerHTML = h;
        };

        STIKS.init();

        const cVer = window.STIKS_CONTENT ? window.STIKS_CONTENT.version : 'НЕТ';
        if (badge) badge.innerText = 'Ядро: ' + STIKS.version + ' | Контент: ' + cVer;
        STIKS.log('Модули подключены: zopa.js (' + STIKS.version + ') + stiks_content.js (' + cVer + ') + bsim_dev.html.');
      });
    })();
  </script>
