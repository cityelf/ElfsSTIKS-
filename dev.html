<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-T-I-K-S // DEV v2.0 (Баланс и Дары)</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0d0c; color: #c8d6cc; font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
    .wrapper { max-width: 520px; margin: 0 auto; background: #131715; border: 1px solid #38bdf8; padding: 15px; }
    h1 { font-size: 16px; text-align: center; color: #7dd3fc; margin: 0 0 12px 0; border-bottom: 1px solid #38bdf8; padding-bottom: 8px; }
    .btn { background: #1e2622; color: #c8d6cc; border: 1px solid #6e2626; padding: 8px 10px; font-family: inherit; font-size: 11px; cursor: pointer; flex: 1; text-align: center; }
    .btn:active { background: #3b1515; }
    .btn-primary { background: #3b1515; border-color: #8f2d2d; color: #f5d6d6; font-weight: bold; }
    .btn-danger { background: #2b1414; border-color: #5c2828; color: #d68585; }
    #game-viewport { min-height: 250px; background: #0e1210; border: 1px solid #6e2626; padding: 12px; }
    .log-box { margin-top: 12px; background: #070908; border: 1px solid #3d1c1c; padding: 8px; font-size: 11px; max-height: 110px; overflow-y: auto; color: #b5a3a3; }
    .top-controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .patch-badge { font-size: 10px; color: #7dd3fc; text-align: right; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>S-T-I-K-S // DEV v2.0 (ТЕСТ БАЛАНСА)</h1>
    <div id="patch-status" class="patch-badge">Сборка: DEV v2.0 (stiks_content.js)</div>
    <div class="top-controls">
      <button id="btn-voice-toggle" class="btn" onclick="toggleVoice()">🔊 Озвучка: ВКЛ</button>
      <button class="btn" style="border-color:#38bdf8;color:#7dd3fc;font-weight:bold;" onclick="cloneFromProd()">📥 Копия из проды</button>
      <button class="btn btn-primary" onclick="downloadHeroesBackup()">💾 Сохранить DEV</button>
      <button class="btn" onclick="document.getElementById('load-heroes-input').click()">📂 Загрузить</button>
      <input type="file" id="load-heroes-input" accept=".json,.txt,application/json,text/plain" style="display:none;" onchange="uploadHeroesBackup(this)">
    </div>
    <div id="game-viewport"></div>
    <div id="sys-log" class="log-box">&gt; Тестовый клиент DEV v2.0 готов.</div>
  </div>

  <script src="stiks_db.js"></script>
  <script src="stiks_engine.js"></script>
  <script src="stiks_content.js"></script>

  <script>
    const DEV_KEY = 'stiks_dev_v2_db';
    const DEV_BKP = 'stiks_dev_v2_db_backup';

    function log(m) {
      const b = document.getElementById('sys-log');
      if (b) b.innerHTML = '&gt; ' + m + '<br>' + b.innerHTML;
    }

    function hasNonEmptyFamilies(obj) {
      return !!(obj && obj.families && typeof obj.families === 'object' && Object.keys(obj.families).length > 0);
    }

    function cloneFromProd() {
      const raw = localStorage.getItem('stiks_prod_db');
      if (!raw) { log('⚠️ В рабочей игре (index.html) пока нет сохранений.'); return; }
      localStorage.setItem(DEV_KEY, raw);
      localStorage.setItem(DEV_BKP, raw);
      if (window.STIKS) {
        window.STIKS.DB_KEY = DEV_KEY;
        window.STIKS.BACKUP_KEY = DEV_BKP;
        window.STIKS.loadDB();
        if (window.STIKS.renderLobby) window.STIKS.renderLobby();
      }
      log('✅ Бойцы из рабочей версии скопированы в DEV v2.0!');
    }

    function toggleVoice() {
      if (!window.STIKS) return;
      window.STIKS.voiceOn = !window.STIKS.voiceOn;
      const btn = document.getElementById('btn-voice-toggle');
      if (btn) btn.innerText = window.STIKS.voiceOn ? '🔊 Озвучка: ВКЛ' : '🔇 Озвучка: ВЫКЛ';
      if (!window.STIKS.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function downloadHeroesBackup() {
      if (!window.STIKS || !window.STIKS.db) return;
      window.STIKS.saveDB();
      const raw = localStorage.getItem(DEV_KEY) || JSON.stringify(window.STIKS.db);
      const blob = new Blob([raw], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'stiks_dev_v2_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      log('💾 Бэкап DEV v2.0 сохранён.');
    }

    function uploadHeroesBackup(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object' || !parsed.families) throw new Error('Неверный формат файла');
          window.STIKS.db = parsed;
          const ser = JSON.stringify(parsed);
          localStorage.setItem(DEV_KEY, ser);
          if (hasNonEmptyFamilies(parsed)) localStorage.setItem(DEV_BKP, ser);
          log('📂 Загружено в DEV v2.0. Обновление...');
          setTimeout(() => location.reload(), 250);
        } catch (err) { alert('Ошибка: ' + err.message); }
        input.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    window.addEventListener('load', function() {
      if (!window.STIKS) return;
      window.STIKS.DB_KEY = DEV_KEY;
      window.STIKS.BACKUP_KEY = DEV_BKP;
      window.STIKS.loadDB();
      if (window.STIKS_CONTENT) window.STIKS_CONTENT.bindHooks();
      const badge = document.getElementById('patch-status');
      if (badge) badge.innerText = 'Сборка: DEV v2.0 • Content v' + (window.STIKS_CONTENT ? window.STIKS_CONTENT.version : '?');
      if (window.STIKS.db && window.STIKS.db.session && window.STIKS.renderGame) window.STIKS.renderGame();
      else if (window.STIKS.renderLobby) window.STIKS.renderLobby();
    });
  </script>
</body>
</html>
