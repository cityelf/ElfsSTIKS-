<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-T-I-K-S // DEV (AUTO-NOCACHE)</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0d0c; color: #c8d6cc; font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
    .wrapper { max-width: 520px; margin: 0 auto; background: #131715; border: 1px solid #6e2626; padding: 12px; border-radius: 6px; }
    h1 { font-size: 15px; text-align: center; color: #d68a8a; margin: 0 0 6px 0; border-bottom: 1px solid #6e2626; padding-bottom: 6px; }
    .btn { background: #1e2622; color: #c8d6cc; border: 1px solid #6e2626; padding: 7px 8px; font-family: inherit; font-size: 11px; cursor: pointer; flex: 1; text-align: center; border-radius: 4px; }
    .btn:active { background: #3b1515; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #3b1515; border-color: #8f2d2d; color: #f5d6d6; font-weight: bold; }
    .btn-ok { background: #153322; border-color: #2e7d4f; color: #b6f5cf; font-weight: bold; }
    .btn-danger { background: #2b1414; border-color: #5c2828; color: #d68585; }
    #game-viewport { min-height: 290px; background: #0e1210; border: 1px solid #6e2626; padding: 10px; border-radius: 4px; }
    .log-box { margin-top: 10px; background: #070908; border: 1px solid #3d1c1c; padding: 8px; font-size: 11px; max-height: 125px; overflow-y: auto; color: #b5a3a3; line-height: 1.35; }
    .top-controls { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .patch-badge { font-size: 10px; color: #98d4ae; text-align: right; margin-bottom: 6px; }
    input, select { background: #080a09; color: #e6f2ea; border: 1px solid #4a1c1c; border-radius: 4px; padding: 5px; font-family: inherit; font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>S-T-I-K-S // УЛЕЙ (DEV)</h1>
    <div id="patch-status" class="patch-badge">Загрузка модулей...</div>
    <div class="top-controls">
      <button id="btn-voice-toggle" type="button" class="btn" onclick="STIKS.toggleVoice()">🔊 Голос: ВКЛ</button>
      <button id="btn-export-save" type="button" class="btn btn-primary" onclick="STIKS.exportSave()">💾 Сейв</button>
      <button type="button" class="btn" onclick="document.getElementById('inp-import-save').click()">📂 Загрузить</button>
      <input type="file" id="inp-import-save" accept=".json,.txt,application/json" style="display:none;" onchange="STIKS.importSave(this.files && this.files.at(0))">
    </div>
    <div id="game-viewport"></div>
    <div id="sys-log" class="log-box">&gt; Инициализация чистого ядра...</div>
  </div>

  <script>
    (function() {
      const ts = Date.now();
      function loadScript(src) {
        return new Promise(function(resolve) {
          const s = document.createElement('script');
          s.src = src + '?v=' + ts;
          s.onload = resolve;
          s.onerror = resolve;
          document.body.appendChild(s);
        });
      }

      loadScript('stiks_content.js').then(function() {
        return loadScript('zopa.js');
      }).then(function() {
        const badge = document.getElementById('patch-status');
        if (!window.STIKS) {
          if (badge) badge.innerText = '❌ Ошибка: zopa.js не загружен';
          return;
        }

        if (typeof window.STIKS.toggleVoice !== 'function') {
          window.STIKS.toggleVoice = function() {
            this.voiceOn = !this.voiceOn;
            const btn = document.getElementById('btn-voice-toggle');
            if (btn) btn.textContent = this.voiceOn ? '🔊 Голос: ВКЛ' : '🔇 Голос: ВЫКЛ';
            if (!this.voiceOn && 'speechSynthesis' in window) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
          };
        }

        if (window.STIKS_CONTENT && typeof window.STIKS_CONTENT.applyToEngines === 'function') {
          window.STIKS_CONTENT.applyToEngines();
        }

        window.STIKS.init();

        const cVer = window.STIKS_CONTENT ? window.STIKS_CONTENT.version : 'НЕТ';
        if (badge) badge.innerText = 'Ядро: ' + window.STIKS.version + ' | Контент: ' + cVer;
        window.STIKS.log('Модули подключены: zopa.js (' + window.STIKS.version + ') + stiks_content.js (' + cVer + ').');
      });
    })();
  </script>
</body>
</html>
