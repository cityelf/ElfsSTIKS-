
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эльфячий Стикс — Портал</title>
    <style>
        body {
            background-color: #0f1410;
            color: #a3e350;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .portal-card {
            background: #161f18;
            border: 2px solid #2d4231;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            margin: 20px;
        }
        .btn {
            display: block;
            background: #253528;
            color: #a3e350;
            border: 1px solid #a3e350;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .btn:active { background: #a3e350; color: #000; }
        .btn-secondary {
            background: transparent;
            border: 1px dashed #2d4231;
            color: #8bbd45;
            font-size: 14px;
            padding: 10px;
        }
        .btn-load {
            background: #384d3c;
            border: 1px solid #8bbd45;
            color: #fff;
        }
        .save-area {
            width: 100%;
            height: 80px;
            background: #090d0a;
            border: 1px solid #2d4231;
            color: #8bbd45;
            border-radius: 6px;
            margin: 10px 0;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            resize: none;
        }
        .game-box {
            background: #090d0a;
            border: 1px solid #2d4231;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <h2>🧝 ЭЛЬФЯЧИЙ СТИКС</h2>
        <p style="color: #d1ebd5; font-size: 14px;">Интерактивная игровая консоль</p>
        
        <!-- Игровой экран, который меняется динамически -->
        <div class="game-box" id="game-screen">
            <h3 id="game-title" style="margin-top:0; color:#a3e350;">Ожидание инициализации...</h3>
            <p id="game-text" style="color:#d1ebd5; font-size:14px;">Вставьте код сохранения ниже, чтобы загрузить текущий мир игры.</p>
        </div>

        <a href="#" id="chat-link" class="btn">🔗 ОТКРЫТЬ НАШ ЧАТ</a>
        
        <!-- Сюда вставляем новые данные -->
        <p style="color: #8bbd45; font-size: 12px; margin-bottom: 0; text-align: left;">📥 Загрузить результат / состояние:</p>
        <textarea id="input-data" class="save-area" placeholder="Вставьте сюда JSON-код из чата..."></textarea>
        <button onclick="loadGameData()" class="btn btn-load">⚡ Обновить результат на экране</button>

        <hr style="border:0; border-top:1px solid #2d4231; margin:20px 0;">

        <!-- Отсюда забираем текущие данные -->
        <p style="color: #8bbd45; font-size: 12px; margin-bottom: 0; text-align: left;">📤 Текущее сохранение:</p>
        <textarea id="save-data" class="save-area" readonly>{"project":"Эльфячий Стикс","status":"Готов к работе"}</textarea>
        <button onclick="copySaveText()" id="copy-btn" class="btn btn-secondary">📋 Скопировать сохранение</button>
    </div>

    <script>
        document.getElementById('chat-link').href = window.location.href;

        // Функция применения настроек и перестройки экрана прямо на лету
        function loadGameData() {
            const inputField = document.getElementById("input-data");
            try {
                const data = JSON.parse(inputField.value);
                
                // Динамически меняем контент страницы на основе JSON
                if(data.project_name) document.getElementById("game-title").innerText = data.project_name;
                if(data.status) document.getElementById("game-text").innerText = "Текущий статус: " + data.status;
                
                // Переносим загруженные данные в поле экспорта
                document.getElementById("save-data").value = JSON.stringify(data);
                
                alert("Данные успешно применились! Экран обновлен.");
                inputField.value = ""; // Очищаем поле ввода
            } catch (e) {
                alert("Ошибка! Проверьте, что вы скопировали весь JSON-код из чата без изменений.");
            }
        }

        // Функция копирования
        function copySaveText() {
            const copyText = document.getElementById("save-data");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.getElementById('copy-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ Скопировано!";
            setTimeout(() => btn.innerHTML = originalText, 2000);
        }
    </script>

</body>
</html>
