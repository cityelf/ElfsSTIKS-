<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эльфячий Стикс</title>
    <style>
        body { 
            background-color: #0f1410; 
            color: #a3e350; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .game-card { 
            background: #161f18; 
            border: 2px solid #2d4231; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            max-width: 400px; 
            width: 90%; 
            box-sizing: border-box;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #090d0a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .quest-text {
            background: #090d0a;
            border: 1px solid #2d4231;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            color: #d1ebd5;
            margin-bottom: 15px;
        }
        .btn { 
            display: block; 
            background: #1a261d; 
            color: #a3e350; 
            border: 1px solid #2d4231; 
            padding: 12px; 
            font-size: 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            margin-top: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:active { background: #2d4231; }
        .btn-action {
            background: #a3e350;
            color: #000;
            font-weight: bold;
            text-align: center;
        }
        .btn-action:active { background: #8bbd45; color: #000; }
        
        /* Стили админки кода */
        .admin-panel {
            margin-top: 20px;
            border-top: 1px dashed #2d4231;
            padding-top: 15px;
        }
        .code-area { 
            width: 100%; 
            height: 180px; 
            background: #050806; 
            border: 1px solid #a3e350; 
            color: #8bbd45; 
            border-radius: 6px; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: monospace; 
            font-size: 11px; 
        }
        .error-box {
            background: #2a1414;
            border: 1px solid #5a2424;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 13px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🧝 ЭЛЬФЯЧИЙ СТИКС</h2>
    
    <div class="stats-bar">
        <span>❤️ <span id="hp">100</span></span>
        <span>✨ <span id="mp">50</span></span>
        <span>🟡 <span id="gold">10</span></span>
    </div>

    <div id="quest-display" class="quest-text">
        Вы открываете глаза. Перед вами простирается туманная, светящаяся зеленым неоном река Стикс. В кармане плаща лежит горсть старых монет. Куда вы направитесь?
    </div>

    <div id="choices-container">
        <button class="btn" onclick="move('forest')">🌲 Идти в Шепчущий лес</button>
        <button class="btn" onclick="move('ruins')">🏛️ Исследовать древние руины</button>
        <button class="btn" onclick="move('river')">💧 Испить воды из реки</button>
    </div>

    <a href="#" id="chat-link" class="btn" style="text-align:center; border-color: #557a3a;">🔗 ОТКРЫТЬ НАШ ЧАТ</a>

    <!-- Быстрая админка кода прямо в телефоне -->
    <div class="admin-panel">
        <div id="admin-error" class="error-box"></div>
        <textarea id="code-editor" class="code-area" placeholder="Вставьте код сохранения или конфигурацию квеста..."></textarea>
        <button onclick="saveCodeDirectly()" class="btn btn-action">💾 Сохранить код прямо в GitHub</button>
    </div>
</div>

<script>
// Автоматическая привязка ссылки на текущий диалог
document.getElementById('chat-link').href = window.location.href;

// НАСТРОЙКИ РЕПОЗИТОРИЯ
const GITHUB_TOKEN = "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"; 
const REPO_OWNER = "cityelf"; 
const REPO_NAME = "cross"; 
const FILE_PATH = "stiks_game.html"; 

// Текущее состояние игры
let gameState = { hp: 100, mp: 50, gold: 10, location: "start" };

// Инициализация текстового поля при загрузке страницы
document.getElementById('code-editor').value = JSON.stringify(gameState, null, 2);

function move(loc) {
    if(loc === 'forest') {
        gameState.hp -= 10;
        document.getElementById('quest-display').innerText = "Деревья шепчут древние заклинания. Вы потеряли 10 HP от магии леса, но нашли тропу.";
    } else if(loc === 'ruins') {
        gameState.gold += 15;
        document.getElementById('quest-display').innerText = "В обломках колонны вы нашли кошель со старыми монетами (+15 золота) !";
    } else if(loc === 'river') {
        gameState.mp += 20;
        document.getElementById('quest-display').innerText = "Вкус воды отдает металлом и вечностью. Ваши магические силы восстановились (+20 MP).";
    }
    
    // Синхронизация с UI
    document.getElementById('hp').innerText = gameState.hp;
    document.getElementById('mp').innerText = gameState.mp;
    document.getElementById('gold').innerText = gameState.gold;
    
    // Обновление содержимого в редакторе
    document.getElementById('code-editor').value = JSON.stringify(gameState, null, 2);
}

// Прямая отправка изменений на GitHub API без перезахода на другие платформы
async function saveCodeDirectly() {
    const editorData = document.getElementById("code-editor").value;
    const errBox = document.getElementById("admin-error");
    errBox.style.display = "none";

    try {
        // 1. Получаем SHA актуальной версии файла из репозитория
        const url = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const getFile = await fetch(url, {
            headers: { "Authorization": `token ${GITHUB_TOKEN}` }
        });
        
        if (!getFile.ok) {
            throw new Error("Не удалось получить SHA файла. Проверьте правильность авторизации и токена.");
        }
        const fileData = await getFile.json();
        const sha = fileData.sha;

        // Кодируем данные из текстового поля в формат Base64
        const base64Content = btoa(unescape(encodeURIComponent(editorData)));

        // 2. Отправляем обновленный контент обратно в ветку GitHub
        const updateFile = await fetch(url, {
            method: "PUT",
            headers: {
                "Authorization": `token ${GITHUB_TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "⚡ Быстрое обновление состояния/кода через мобильную админку",
                content: base64Content,
                sha: sha
            })
        });

        if (updateFile.ok) {
            alert("🚀 Изменения успешно отправлены в ваш GitHub! Netlify обновит сайт в течение 15 секунд.");
            setTimeout(() => window.location.reload(), 1500);
        } else {
            const errRes = await updateFile.json();
            throw new Error(errRes.message || "Ошибка записи файла.");
        }

    } catch (err) {
        errBox.innerText = "❌ Ошибка GitHub API: " + err.message;
        errBox.style.display = "block";
    }
}
</script>

</body>
</html>
