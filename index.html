<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эльфячий Стикс — Панель Управления</title>
    <style>
        body {
            background-color: #0f1410;
            color: #a3e350;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .portal-card {
            background: #161f18;
            border: 2px solid #2d4231;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 90%;
        }
        .game-log {
            background: #090d0a;
            border: 1px solid #2d4231;
            border-radius: 6px;
            padding: 15px;
            text-align: left;
            min-height: 60px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #d1ebd5;
            line-height: 1.4;
        }
        .input-area {
            width: 100%;
            height: 120px;
            background: #090d0a;
            border: 1px solid #2d4231;
            color: #a3e350;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            margin-bottom: 15px;
        }
        .token-area {
            width: 100%;
            background: #1a241c;
            border: 1px dashed #2d4231;
            color: #8bbd45;
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #253528;
            color: #a3e350;
            border: 1px solid #a3e350;
            padding: 14px 0;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn:active { background: #a3e350; color: #000; }
        .btn-action { background: #a3e350; color: #000; border: none; }
    </style>
</head>
<body>

    <div class="portal-card">
        <h2>🧝 ЭЛЬФЯЧИЙ СТИКС</h2>
        
        <div id="status-log" class="game-log">
            ⚙️ <b>Безопасный режим консоли.</b><br>Введите ваш GitHub токен ниже (он сохранится локально на телефоне), вставьте код игры и обновите сайт.
        </div>
        
        <!-- Скрытое поле для токена (хранится локально) -->
        <input type="password" id="token-input" class="token-area" placeholder="Вставьте ваш ghp_... токен сюда">
        
        <!-- Окно для вставки нового кода от ИИ -->
        <textarea id="code-input" class="input-area" placeholder="Вставьте сюда полный HTML-код игры из чата..."></textarea>
        
        <!-- Кнопка обновления -->
        <button onclick="autoUploadCode()" id="upload-btn" class="btn btn-action">⚡ Применить и обновить сайт</button>
    </div>

    <script>
        const REPO_OWNER = "cityelf";       
        const REPO_NAME = "ElfsSTIKS-HTML"; 
        const FILE_PATH = "index.html";

        // Подгружаем токен из памяти телефона, если он уже вводился ранее
        if (localStorage.getItem("stiks_token")) {
            document.getElementById("token-input").value = localStorage.getItem("stiks_token");
        }

        async function autoUploadCode() {
            const tokenField = document.getElementById("token-input").value.trim();
            const newCode = document.getElementById("code-input").value.trim();
            const statusLog = document.getElementById("status-log");
            const btn = document.getElementById("upload-btn");

            if (!tokenField) {
                alert("Пожалуйста, введите ваш GitHub токен!");
                return;
            }
            if (!newCode) {
                alert("Поле кода пустое!");
                return;
            }

            // Сохраняем токен в память браузера телефона
            localStorage.setItem("stiks_token", tokenField);

            btn.disabled = true;
            btn.innerText = "⏳ Авто-обновление файла...";
            statusLog.innerHTML = "🔄 Безопасно передаю изменения в ваш репозиторий...";

            try {
                const url = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
                const getResponse = await fetch(url, {
                    headers: { "Authorization": `token ${tokenField}` }
                });

                if (!getResponse.ok) throw new Error("Неверный токен или ошибка доступа к репозиторию.");
                const fileData = await getResponse.json();
                const fileSha = fileData.sha;

                const encodedCode = btoa(encodeURIComponent(newCode).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                    return String.fromCharCode(parseInt(p1, 16));
                }));

                const putResponse = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${tokenField}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Обновление игры из безопасной консоли Стикса",
                        content: encodedCode,
                        sha: fileSha
                    })
                });

                if (putResponse.ok) {
                    statusLog.innerHTML = "✅ <b>Сайт успешно переписан!</b><br>Netlify применит изменения через 10 секунд. Теперь вы можете вставлять любой игровой код прямо отсюда.";
                    document.getElementById("code-input").value = "";
                } else {
                    const errData = await putResponse.json();
                    throw new Error(errData.message || "Ошибка отправки.");
                }

            } catch (error) {
                statusLog.innerHTML = `❌ <b>Ошибка:</b><br>${error.message}`;
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ Применить и обновить сайт";
            }
        }
    </script>

</body>
</html>
