<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S-T-I-K-S // Палата № 6</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0b0d0c; color: #d8dee9; font-family: monospace; font-size: 12px; line-height: 1.4; padding: 8px; }
  .wrapper { max-width: 640px; margin: 0 auto; background: #111613; border: 1px solid #6e2626; border-radius: 8px; padding: 10px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #6e2626; padding-bottom: 6px; margin-bottom: 8px; }
  .header h1 { font-size: 14px; color: #ff9e9e; }
  .top-controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .btn { background: #1b221e; color: #e2e8f0; border: 1px solid #6e2626; border-radius: 5px; padding: 6px 9px; font-family: monospace; font-size: 11px; cursor: pointer; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #3b1515; border-color: #8f2d2d; color: #f5d6d6; font-weight: bold; }
  .btn-danger { background: #4a1216; border-color: #b91c1c; color: #fecaca; }
  #game-viewport { min-height: 260px; margin-bottom: 8px; }
  #sys-log { background: #080908; border: 1px solid #3d1c1c; border-radius: 5px; padding: 7px; height: 145px; overflow-y: auto; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>☣️ S-T-I-K-S // ПАЛАТА № 6</h1>
    <span id="patch-status" style="font-size:10px;color:#d48a8a;">Ядро: v1.9.5-merged</span>
  </div>
  <div class="top-controls">
    <button id="btn-voice" class="btn" onclick="STIKS.voiceOn=!STIKS.voiceOn;this.innerText=STIKS.voiceOn?'🔊 Голос: ВКЛ':'🔇 Голос: ВЫКЛ'">🔊 Голос: ВКЛ</button>
    <button class="btn" onclick="STIKS.exportSave()">💾 Сейвы Фамилий</button>
    <button class="btn" id="btn-2d-3d" onclick="if(window.STIKS3D) STIKS3D.toggleMode()" style="border-color:#10b981;color:#34d399;font-weight:bold;">🧊 3D: ВКЛ</button>
  </div>
  <div id="game-viewport"></div>
  <div id="sys-log"></div>
</div>

<script src="data.js?v=40"></script>
<script src="stiks_db.js?v=40"></script>
<script src="stiks_content.js?v=40"></script>
<script src="stiks_engine.js?v=40"></script>
<script src="patch.js?v=40"></script>
<script src="stiks_patcher.js?v=40"></script>
<script src="three.min.js?v=160"></script>
<script src="stiks_3d.js?v=3"></script>
</body>
</html>
