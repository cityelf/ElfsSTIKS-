<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Проекта Стикс</title>
    <style>
        body { background-color: #0f1410; color: #a3e350; font-family: monospace; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #161f18; border: 2px solid #2d4231; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; color: #00ffcc; font-size: 18px; }
        .section { margin-bottom: 20px; padding: 10px; background: #090d0a; border: 1px solid #2d4231; }
        .label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #8bbd45; }
        textarea { width: 100%; height: 120px; background: #000; border: 1px solid #2d4231; color: #a3e350; padding: 8px; box-sizing: border-box; resize: vertical; font-family: inherit; font-size: 12px; }
        .btn { display: block; width: 100%; background: #253528; color: #a3e350; border: 1px solid #a3e350; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; font-family: inherit; margin-top: 10px; box-sizing: border-box; }
        .btn:active { background: #a3e350; color: #000; }
        .preview-box { min-height: 80px; padding: 10px; background: #101410; border: 1px dashed #2d4231; margin-top: 10px; font-size: 14px; text-align: left; }
        .btn-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎛️ ИНСТРУМЕНТ СБОРКИ СТИКСА</h2>
    
    <!-- Сюда вы будете вставлять новые куски из чата -->
    <div class="section">
        <div class="label">📥 Добавить новый кусок кода / данных:</div>
        <textarea id="code-input" placeholder="Вставьте сюда новый кусок кода или логики из нашего чата..."></textarea>
        <button onclick="injectChunk()" class="btn" style="background: #a3e350; color: #000;">⚡ Добавить в проект</button>
    </div>

    <!-- Интерактивная зона для тестов на лету -->
    <div class="section">
        <div class="label">🖥️ Живое игровое ядро (Тест):</div>
        <div id="game-text" class="preview-box">Проект пуст. Добавьте первый кусок кода выше.</div>
        <div id="game-buttons" class="btn-panel"></div>
    </div>

    <!-- Кнопка сброса кэша -->
    <button onclick="resetBuilder()" class="btn" style="background: transparent; border-color: #5a2424; color: #ff6b6b; font-size: 11px; padding: 5px;">🗑️ Очистить сборщик</button>
</div>

<script>
// Внутреннее хранилище собранной игры в памяти телефона
let projectData = {
    core: null,
    scenes: {},
    currentScene: null
};

// Загрузка сохраненной сборки при старте страницы
window.onload = function() {
    const saved = localStorage.getItem('stiks_builder_data');
    if (saved) {
        try {
            projectData = JSON.parse(saved);
            runEngine();
        } catch(e) {
            projectData = { core: null, scenes: {}, currentScene: null };
        }
    }
};

// Функция обработки вставляемых из чата кусков кода
function injectChunk() {
    const input = document.getElementById('code-input').value.trim();
    if (!input) return;

    try {
        const chunk = JSON.parse(input);
        
        // Если это кусок с системными настройками ядра
        if (chunk.type === "core") {
            projectData.core = chunk.data;
            if (!projectData.currentScene) projectData.currentScene = chunk.data.startScene;
        } 
        // Если это кусок новой локации/сцены
        else if (chunk.type === "scene") {
            projectData.scenes[chunk.id] = chunk.data;
        }

        // Сохраняем обновленную сборку в память телефона
        localStorage.setItem('stiks_builder_data', JSON.stringify(projectData));
        document.getElementById('code-input').value = "";
        alert("✅ Кусок успешно добавлен в итоговую сборку!");
        runEngine();

    } catch (e) {
        alert("❌ Ошибка: Вставленный текст не является правильным куском данных квеста.");
    }
}

// Движок, который собирает и запускает игру на ходу из кусочков
function runEngine() {
    if (!projectData.core) {
        document.getElementById('game-text').innerText = "Ядро игры не загружено. Скиньте первый базовый кусок кода.";
        return;
    }

    const sceneId = projectData.currentScene;
    const scene = projectData.scenes[sceneId];

    if (!scene) {
        document.getElementById('game-text').innerText = `Ядро работает. Локация "${sceneId}" пока пуста. Скиньте кусок этой сцены из чата.`;
        document.getElementById('game-buttons').innerHTML = "";
        return;
    }

    // Отрисовка
    document.getElementById('game-text').innerText = scene.text;
    
    let btnHtml = "";
    scene.choices.forEach(choice => {
        btnHtml += `<button class="btn" onclick="changeScene('${choice.target}')">${choice.text}</button>`;
    });
    document.getElementById('game-buttons').innerHTML = btnHtml;
}

function changeScene(targetId) {
    projectData.currentScene = targetId;
    localStorage.setItem('stiks_builder_data', JSON.stringify(projectData));
    runEngine();
}

function resetBuilder() {
    if (confirm("Сбросить всю сборку?")) {
        localStorage.removeItem('stiks_builder_data');
        projectData = { core: null, scenes: {}, currentScene: null };
        location.reload();
    }
}
</script>

</body>
</html>
