<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эльфячий Стикс — Портал</title>
    <style>
        body { 
            background-color: #0f1410; 
            color: #a3e350; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .portal-card { 
            background: #161f18; 
            border: 2px solid #2d4231; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            max-width: 400px; 
            width: 90%; 
        }
        .btn { 
            display: block; 
            background: #253528; 
            color: #a3e350; 
            border: 1px solid #a3e350; 
            padding: 15px 20px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            text-decoration: none; 
            margin-top: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            cursor: pointer; 
            transition: all 0.2s ease; 
            width: 100%;
            box-sizing: border-box;
        }
        .btn:active { 
            background: #a3e350; 
            color: #000; 
        }
        .btn-secondary { 
            background: transparent; 
            border: 1px dashed #2d4231; 
            color: #8bbd45; 
            font-size: 14px; 
            padding: 10px; 
        }
        .btn-secondary:active { 
            background: #2d4231; 
            color: #a3e350; 
        }
        .save-area { 
            width: 100%; 
            height: 80px; 
            background: #090d0a; 
            border: 1px solid #2d4231; 
            color: #8bbd45; 
            border-radius: 6px; 
            margin-top: 15px; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: monospace; 
            font-size: 11px; 
            resize: none; 
        }
        .error-box {
            background: #2a1414;
            border: 1px solid #5a2424;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="portal-card">
    <h2>🧝 ЭЛЬФЯЧИЙ СТИКС</h2>
    <p style="color: #d1ebd5; font-size: 14px;">Ваша персональная точка сохранения проекта</p>
    
    <div id="error-display" class="error-box"></div>

    <a href="#" id="chat-link" class="btn">🔗 ОТКРЫТЬ НАШ ЧАТ</a>
    
    <textarea id="save-data" class="save-area" placeholder="Вставьте код сохранения сюда...">{"project":"Эльфячий Стикс","status":"Сохранено"}</textarea>
    
    <button onclick="copySaveText()" class="btn btn-secondary">📋 Скопировать текст сохранения</button>
    <button onclick="applyAndRefresh()" class="btn" style="background: #a3e350; color: #000;">⚡ Применить и обновить сайт</button>
</div>

<script>
// Автоматическая подстановка ссылки на текущий диалог
document.getElementById('chat-link').href = window.location.href;

function showError(message) {
    const errBox = document.getElementById("error-display");
    errBox.innerText = "❌ Ошибка: " + message;
    errBox.style.display = "block";
}

function copySaveText() {
    try {
        const copyText = document.getElementById("save-data");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        
        const btn = document.querySelector('.btn-secondary');
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Скопировано!";
        setTimeout(() => btn.innerHTML = originalText, 2000);
    } catch (err) {
        showError("Не удалось скопировать");
    }
}

async function applyAndRefresh() {
    const saveData = document.getElementById("save-data").value;
    const errBox = document.getElementById("error-display");
    errBox.style.display = "none"; // Сбрасываем старую ошибку

    // Проверка на пустой ввод
    if (!saveData.trim()) {
        showError("Поле сохранения пустое!");
        return;
    }

    // Безопасная проверка JSON перед отправкой, чтобы не ломать скрипт
    try {
        JSON.parse(saveData);
    } catch (e) {
        showError("Неверный формат кода сохранения (ошибка в JSON)");
        return;
    }

    // Отправка запроса с жестким ограничением по времени (таймаут 5 секунд)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    try {
        // Здесь ваш URL бэкенда. Если он упадет, игра НЕ зависнет, а просто покажет ошибку
        const response = await fetch('https://netlify.app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: saveData,
            signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (response.ok) {
            alert("Данные успешно применены! Перезагружаем...");
            window.location.reload();
        } else {
            showError("Сервер ответил кодом " + response.status);
        }
    } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
            showError("Сервер не ответил за 5 секунд (Таймаут)");
        } else {
            showError("Не удалось связаться с сервером (Failed to fetch)");
        }
    }
}

// Безопасный вызов инициализации интерфейса при старте
function updateUI() {
    try {
        // Логика отрисовки, защищенная от бесконечных циклов
        console.log("Интерфейс «Эльфячьего Стикса» успешно инициализирован.");
    } catch (err) {
        console.error("Ошибка UI:", err);
    }
}

// Запускаем UI один раз после полной загрузки страницы
window.onload = updateUI;
</script>

</body>
</html>
