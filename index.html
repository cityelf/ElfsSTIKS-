<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эльфячий Стикс</title>
    <style>
        body { 
            background-color: #0f1410; 
            color: #a3e350; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .game-card { 
            background: #161f18; 
            border: 2px solid #2d4231; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            max-width: 400px; 
            width: 90%; 
            box-sizing: border-box;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #090d0a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .quest-text {
            background: #090d0a;
            border: 1px solid #2d4231;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            color: #d1ebd5;
            margin-bottom: 15px;
        }
        .btn { 
            display: block; 
            background: #1a261d; 
            color: #a3e350; 
            border: 1px solid #2d4231; 
            padding: 12px; 
            font-size: 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            margin-top: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:active { background: #2d4231; }
        .btn-action {
            background: #a3e350;
            color: #000;
            font-weight: bold;
            text-align: center;
        }
        .btn-action:active { background: #8bbd45; color: #000; }
        
        .admin-panel {
            margin-top: 20px;
            border-top: 1px dashed #2d4231;
            padding-top: 15px;
        }
        .code-area { 
            width: 100%; 
            height: 100px; 
            background: #050806; 
            border: 1px solid #a3e350; 
            color: #8bbd45; 
            border-radius: 6px; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: monospace; 
            font-size: 11px; 
        }
        .status-box {
            background: #142a14;
            border: 1px solid #245a24;
            color: #6bff6b;
            padding: 8px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 13px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🧝 ЭЛЬФЯЧИЙ СТИКС</h2>
    
    <div class="stats-bar">
        <span>❤️ <span id="hp">100</span></span>
        <span>✨ <span id="mp">50</span></span>
        <span>🟡 <span id="gold">10</span></span>
    </div>

    <div id="quest-display" class="quest-text">
        Вы открываете глаза. Перед вами простирается туманная, светящаяся зеленым неоном река Стикс. В кармане плаща лежит горсть старых монет. Куда вы направитесь?
    </div>

    <div id="choices-container">
        <button class="btn" onclick="move('forest')">🌲 Идти в Шепчущий лес</button>
        <button class="btn" onclick="move('ruins')">🏛️ Исследовать древние руины</button>
        <button class="btn" onclick="move('river')">💧 Испить воды из реки</button>
    </div>

    <a href="#" id="chat-link" class="btn" style="text-align:center; border-color: #557a3a;">🔗 ОТКРЫТЬ НАШ ЧАТ</a>

    <!-- Панель управления сохранениями -->
    <div class="admin-panel">
        <div id="save-status" class="status-box"></div>
        <textarea id="code-editor" class="code-area" placeholder="Слепок данных сохранения..."></textarea>
        <button onclick="applyManualSave()" class="btn btn-action" style="margin-bottom: 8px;">⚡ Применить код сохранения</button>
        <button onclick="clearSave()" class="btn" style="background: #2a1414; border-color: #5a2424; color: #ff6b6b; text-align: center; font-size: 13px; padding: 6px;">🗑️ Сбросить прогресс игры</button>
    </div>
</div>

<script>
document.getElementById('chat-link').href = window.location.href;

// Стартовое состояние
const defaultState = { hp: 100, mp: 50, gold: 10, text: "Вы открываете глаза. Перед вами простирается туманная, светящаяся зеленым неоном река Стикс. В кармане плаща лежит горсть старых монет. Куда вы направитесь?" };
let gameState = {};

// Функция загрузки игры из памяти телефона
function loadGame() {
    const saved = localStorage.getItem('elf_stiks_save');
    if (saved) {
        try {
            gameState = JSON.parse(saved);
        } catch(e) {
            gameState = { ...defaultState };
        }
    } else {
        gameState = { ...defaultState };
    }
    updateUI();
}

function updateUI() {
    document.getElementById('hp').innerText = gameState.hp;
    document.getElementById('mp').innerText = gameState.mp;
    document.getElementById('gold').innerText = gameState.gold;
    document.getElementById('quest-display').innerText = gameState.text;
    document.getElementById('code-editor').value = JSON.stringify(gameState);
}

// Автоматическое мгновенное сохранение при каждом шаге
function saveGame() {
    localStorage.setItem('elf_stiks_save', JSON.stringify(gameState));
    updateUI();
}

function move(loc) {
    if(loc === 'forest') {
        gameState.hp -= 10;
        gameState.text = "Деревья шепчут древние заклинания. Вы потеряли 10 HP от магии леса, но нашли тропу.";
    } else if(loc === 'ruins') {
        gameState.gold += 15;
        gameState.text = "В обломках колонны вы нашли кошель со старыми монетами (+15 золота) !";
    } else if(loc === 'river') {
        gameState.mp += 20;
        gameState.text = "Вкус воды отдает металлом и вечностью. Ваши магические силы восстановились (+20 MP).";
    }
    saveGame();
}

// Ручное применение кода (если скопировали слепок из чата)
function applyManualSave() {
    const inputData = document.getElementById("code-editor").value;
    const statusBox = document.getElementById("save-status");
    
    try {
        const parsed = JSON.parse(inputData);
        if(parsed.hp !== undefined && parsed.gold !== undefined) {
            gameState = parsed;
            saveGame();
            statusBox.innerText = "✅ Прогресс успешно изменён и сохранён!";
            statusBox.style.display = "block";
            statusBox.style.background = "#142a14";
            statusBox.style.color = "#6bff6b";
        } else {
            throw new Error();
        }
    } catch(e) {
        statusBox.innerText = "❌ Ошибка: Неверный формат кода сохранения!";
        statusBox.style.display = "block";
        statusBox.style.background = "#2a1414";
        statusBox.style.color = "#ff6b6b";
    }
}

// Сброс игры
function clearSave() {
    if(confirm("Вы уверены, что хотите начать заново?")) {
        localStorage.removeItem('elf_stiks_save');
        gameState = { ...defaultState };
        updateUI();
        const statusBox = document.getElementById("save-status");
        statusBox.style.display = "none";
    }
}

// Запуск при старте страницы
window.onload = loadGame;
</script>

</body>
</html>
