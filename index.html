<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-T-I-K-S // Палата № 6</title>
    <style>
        :root {
            --bg-dark: #07090d;
            --bg-panel: rgba(15, 20, 28, 0.88);
            --border: rgba(56, 189, 248, 0.25);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        #global-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 20%, #111827 0%, #05070a 100%); z-index: -1; }
        #app { max-width: 960px; margin: 0 auto; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; }
        .top-controls { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; backdrop-filter: blur(8px); position: sticky; top: 6px; z-index: 50; }
        .header-info { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
        .header-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-icon { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.3); color: #f8fafc; border-radius: 8px; padding: 6px 9px; font-size: 0.9rem; cursor: pointer; transition: 0.15s; }
        .btn-icon:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); }
        #screen-container { flex: 1; display: flex; flex-direction: column; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 14px; }
        .modal-box { background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 16px; max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.75); }
        .log-drawer { position: fixed; right: 12px; bottom: 12px; width: 340px; max-width: calc(100vw - 24px); height: 320px; background: rgba(15, 23, 42, 0.96); border: 1px solid var(--border); border-radius: 12px; z-index: 90; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .log-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid rgba(148,163,184,0.2); font-size: 0.8rem; font-weight: 700; color: var(--accent); }
        .btn-close { background: none; border: none; color: #94a3b8; font-size: 1rem; cursor: pointer; }
        .log-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.8rem; line-height: 1.45; }
        .pc-layout { display: grid; grid-template-columns: 280px 1fr 300px; gap: 12px; align-items: start; }
        .pc-col { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 75vh; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <div id="global-bg"></div>
    <div id="app">
        <div id="global-header" class="top-controls" style="display:none;">
            <span id="header-info" class="header-info"></span>
            <div class="header-buttons">
                <button class="btn-icon" onclick="STIKS.openCharSheet()" title="Персонаж и Экипировка">👤</button>
                <button class="btn-icon" onclick="STIKS.toggleLogPanel()" title="Бортовой журнал">📜</button>
                <button class="btn-icon" onclick="STIKS.openHiveJournal()" title="Дневник Улья (База знаний)">📖</button>
                <button class="btn-icon" onclick="STIKS.openAudioSettings()" title="Звук и озвучка">🔊</button>
                <button class="btn-icon" id="btn-2d-3d" onclick="if(window.STIKS3D) STIKS3D.toggleMode()" title="Переключить вид 2D / 3D" style="border-color:rgba(16,185,129,0.55);color:#34d399;">🧊 3D</button>
                <button class="btn-icon" id="btn-pc-mode" onclick="STIKS.togglePcMode()" title="ПК-режим (3 колонки)">🖥️</button>
                <button class="btn-icon" id="btn-quit" onclick="STIKS.quitToMenu()" title="Выйти в меню">🚪</button>
            </div>
        </div>
        <div id="pc-layout" class="pc-layout" style="display:none;">
            <div id="pc-col-left" class="pc-col pc-col-left"></div>
            <div id="pc-col-center" class="pc-col pc-col-center"></div>
            <div id="pc-col-right" class="pc-col pc-col-right"></div>
        </div>
        <div id="screen-container"></div>
        <div id="modal-container" class="modal-overlay" style="display:none;"></div>
        <div id="log-drawer" class="log-drawer" style="display:none;">
            <div class="log-header">
                <span>БОРТОВОЙ ЖУРНАЛ</span>
                <button class="btn-close" onclick="STIKS.toggleLogPanel()">✕</button>
            </div>
            <div id="log-content" class="log-content"></div>
        </div>
    </div>
    <script src="data.js?v=34"></script>
    <script src="stiks_db.js?v=34"></script>
    <script src="stiks_content.js?v=34"></script>
    <script src="stiks_engine.js?v=34"></script>
    <script src="patch.js?v=34"></script>
    <script src="stiks_patcher.js?v=34"></script>
    <script src="three.min.js?v=160"></script>
    <script src="stiks_3d.js?v=2"></script>
</body>
</html>
