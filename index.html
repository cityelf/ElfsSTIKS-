<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-T-I-K-S: Тактический Симулятор</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0b0d0c; color: #c8d6cc; font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
        .wrapper { max-width: 520px; margin: 0 auto; background: #131715; border: 1px solid #2e3b33; padding: 14px; }
        h1 { font-size: 16px; text-align: center; color: #7fa88b; margin: 0 0 12px 0; border-bottom: 1px solid #2e3b33; padding-bottom: 8px; letter-spacing: 1px; }
        .btn { background: #1e2622; color: #c8d6cc; border: 1px solid #3d4f44; padding: 8px 10px; font-family: inherit; font-size: 12px; cursor: pointer; flex: 1; text-align: center; }
        .btn:active { background: #3d4f44; color: #fff; }
        .btn-primary { background: #2d4a38; border-color: #5c8f6e; color: #e6f5eb; font-weight: bold; }
        .btn-danger { background: #2b1414; border-color: #5c2828; color: #d68585; }
        #game-viewport { min-height: 260px; background: #0e1210; border: 1px solid #2e3b33; padding: 12px; }
        .log-box { margin-top: 10px; background: #070908; border: 1px solid #1f2923; padding: 8px; font-size: 11px; max-height: 115px; overflow-y: auto; color: #8c9e92; }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>S-T-I-K-S // ТАКТИЧЕСКИЙ СИМУЛЯТОР</h1>
    <div id="game-viewport">Загрузка модулей Улья...</div>
    <div id="sys-log" class="log-box">> Система Улья активна.</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn" style="font-size:10px;" onclick="toggleVoice()">🔊 Озвучка: ВКЛ</button>
        <button class="btn" style="font-size:10px;" onclick="exportSave()">💾 Сохранения</button>
    </div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
</body>
</html>
