<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>JS Cleaner</title>
<style>
  body{margin:0;padding:16px;background:#0d1117;color:#e6edf3;font-family:sans-serif;line-height:1.4}
  .box{max-width:900px;margin:0 auto}
  .drop{border:2px dashed #30363d;border-radius:10px;padding:25px;text-align:center;background:#161b22;cursor:pointer}
  .btn{background:#2f81f7;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}
  .btn:disabled{opacity:.4}
  .green{background:#3fb950;color:#000}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:12px}
  .ok{color:#3fb950}.err{color:#f85149}.warn{color:#d29922}
  .row{padding:6px;background:#0d1117;border-radius:4px;margin-top:5px;font-size:13px;display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="box">
  <h3>🛠️ Очиститель и проверка JS-файла</h3>
  <div class="drop" id="dz"><b>Нажмите сюда, чтобы выбрать ваш .js файл</b><input type="file" id="fi" accept=".js,.txt" style="display:none"></div>
  <div id="ws" style="display:none">
    <div class="card">
      <div id="stats" style="font-size:14px;margin-bottom:10px"></div>
      <button class="btn green" id="btnFix">⚡ Исправить и проверить</button>
      <button class="btn" id="btnSave" disabled>💾 Скачать чистый .js</button>
      <div id="status" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div class="card"><b>🔍 Ошибки и пропущенные запятые:</b><div id="errList" style="margin-top:6px"></div></div>
    <div class="card"><b>📑 Дубликаты методов (галочка = удалить):</b><div id="dupList" style="margin-top:6px"></div></div>
  </div>
</div>
<script>
let raw='',fName='game.js',out='';
const dz=document.getElementById('dz'),fi=document.getElementById('fi');
dz.onclick=()=>fi.click();
fi.onchange=e=>{
  const f=e.target.files.item(0);if(!f)return;
  fName=f.name;
  const r=new FileReader();
  r.onload=ev=>{raw=ev.target.result;document.getElementById('ws').style.display='block';runCheck(raw)};
  r.readAsText(f,'UTF-8');
};function scan(code){
  const len=code.length,st=[],errs=[],meths=[];
  let ln=1,mode='N',dep=0;
  for(let i=0;i<len;i++){
    const c=code.charAt(i),nx=code.charAt(i+1);
    if(c==='\n')ln++;
    if(mode==='LC'){if(c==='\n')mode='N';continue}
    if(mode==='BC'){if(c==='*'&&nx==='/'){mode='N';i++}continue}
    if(mode==='SQ'){if(c==='\\'){i++;continue}if(c==="'")mode='N';continue}
    if(mode==='DQ'){if(c==='\\'){i++;continue}if(c==='"')mode='N';continue}
    if(mode==='TP'){
      if(c==='\\'){i++;continue}
      if(c==='`'){mode='N';continue}
      if(c==='$'&&nx==='{'){dep++;st.push({c:'{',ln,tp:1});mode='N';i++}
      continue;
    }
    if(c==='/'&&nx==='/'){mode='LC';i++;continue}
    if(c==='/'&&nx==='*'){mode='BC';i++;continue}
    if(c==="'"){mode='SQ';continue}
    if(c==='"'){mode='DQ';continue}
    if(c==='`'){mode='TP';continue}
    if(c==='{'||c==='('||c==='['){
      if(c==='{'){
        const prev=code.slice(Math.max(0,i-120),i);
        const m=prev.match(/(?:^|[,;\n{])\s*(?:async\s+)?([a-zA-Z_$][\w$]*)\s*\(([^()]*)\)\s*$/);
        if(m&&!['if','for','while','switch','catch','function'].includes(m.at(1))){
          const sIdx=i-m.at(0).length+m.at(0).search(/\S/);
          const pCh=code.slice(0,sIdx).trimEnd().slice(-1);
          const sLn=code.slice(0,sIdx).split('\n').length;
          if(pCh==='}')errs.push(`Стр. ${sLn}: пропущена запятая перед методом ${m.at(1)}()`);
          meths.push({name:m.at(1),dep,s:sIdx,sLn,e:-1,eLn:-1});
        }
        dep++;
      }
      st.push({c,ln});
    }else if(c==='}'||c===')'||c===']'){
      const exp=c==='}'?'{':(c===')'?'(':'[');
      if(!st.length)errs.push(`Стр. ${ln}: лишняя скобка «${c}»`);
      else{
        const top=st.pop();
        if(top.c!==exp)errs.push(`Стр. ${ln}: ожидалась пара к «${top.c}» (стр. ${top.ln}), а встречена «${c}»`);
        if(c==='}'){
          dep--;
          for(let k=meths.length-1;k>=0;k--)if(meths.at(k).e===-1&&meths.at(k).dep===dep){meths.at(k).e=i;meths.at(k).eLn=ln;break}
          if(top.tp)mode='TP';
        }
      }
    }
  }
  if(mode==='TP')errs.push('Конец файла: не закрыта обратная кавычка `');
  while(st.length){const u=st.pop();errs.push(`Стр. ${u.ln}: не закрыта «${u.c}»`)}
  return{errs,meths:meths.filter(m=>m.e!==-1),ln};
}

function runCheck(code){
  const{errs,meths,ln}=scan(code);
  const grp={};
  meths.forEach(m=>{const k=m.dep+':'+m.name;(grp[k]=grp[k]||[]).push(m)});
  const dups=Object.values(grp).filter(g=>g.length>1);
  document.getElementById('stats').innerHTML=`Строк: <b>${ln}</b> | Методов: <b>${meths.length}</b> | Дублей: <b class="${dups.length?'warn':'ok'}">${dups.length}</b> | Ошибок: <b class="${errs.length?'err':'ok'}">${errs.length}</b>`;
  document.getElementById('errList').innerHTML=errs.length?errs.map(e=>`<div class="err">❌ ${e}</div>`).join(''):'<div class="ok">✅ Ошибок скобок и запятых не найдено</div>';
  document.getElementById('dupList').innerHTML=!dups.length?'<div class="ok">✅ Дублей методов нет</div>':dups.map(g=>
    `<div style="margin-top:8px"><b>${g.at(0).name}()</b> (повторов: ${g.length}):`+
    g.map((it,idx)=>{
      const isLast=idx===g.length-1;
      return `<div class="row"><input type="checkbox" class="cb" data-s="${it.s}" data-e="${it.e}" ${!isLast?'checked':''}> Версия #${idx+1} (стр. ${it.sLn}–${it.eLn}) ${isLast?'<span class="ok">[Оставить]</span>':'<span class="err">[Удалить]</span>'}</div>`;
    }).join('')+'</div>'
  ).join('');
}

document.getElementById('btnFix').onclick=()=>{
  let res=raw.replace(/[\uFEFF\u200B-\u200D\u2060]/g,'');
  const del=Array.from(document.querySelectorAll('.cb:checked')).map(c=>({s:+c.dataset.s,e:+c.dataset.e})).sort((a,b)=>b.s-a.s);
  del.forEach(r=>{
    let a=r.s,b=r.e+1;
    while(b<res.length&&/[ \t\r\n]/.test(res.charAt(b)))b++;
    if(res.charAt(b)===','){b++;while(b<res.length&&/[ \t\r\n]/.test(res.charAt(b)))b++}
    while(a>0&&/[ \t]/.test(res.charAt(a-1)))a--;
    res=res.slice(0,a)+res.slice(b);
  });
  res=res.replace(/(\})(\s*\n\s*)((?:async\s+)?[a-zA-Z_$][\w$]*\s*\([^()]*\)\s*\{)/g,(m,br,sp,fn)=>{
    const nm=fn.replace(/^async\s+/,'').split('(').at(0).trim();
    return['if','for','while','switch','catch','function'].includes(nm)?m:br+','+sp+fn;
  });
  out=res;
  const st=document.getElementById('status');
  try{
    new Function(out);
    st.innerHTML=`<span class="ok">✅ Всё исправлено! Синтаксис чистый. Удалено дублей: ${del.length}.</span>`;
  }catch(e){
    st.innerHTML=`<span class="err">⚠️ Осталась ошибка: ${e.message}</span>`;
  }
  document.getElementById('btnSave').disabled=false;
};

document.getElementById('btnSave').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'application/javascript;charset=utf-8'}));
  a.download=fName.replace(/\.js$/i,'')+'_clean.js';
  a.click();
};
</script>
</body>
</html>
