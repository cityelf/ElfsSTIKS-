<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STIKS Auto-Patcher</title>
<style>
  body{margin:0;padding:14px;background:#0d1117;color:#e6edf3;font-family:sans-serif;font-size:14px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:12px}
  textarea{width:100%;height:140px;background:#0d1117;color:#7ee787;border:1px solid #30363d;border-radius:6px;padding:8px;box-sizing:border-box;font-family:monospace;font-size:12px}
  .btn{width:100%;padding:12px;border:none;border-radius:6px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:8px}
  .blue{background:#2f81f7;color:#fff}
  .green{background:#3fb950;color:#000}
  .btn:disabled{opacity:.4}
  .ok{color:#3fb950}.err{color:#f85149}
</style>
</head>
<body>
  <h3 style="margin:0 0 10px">🔧 Авто-патчер для ZOPA.JS</h3>
  
  <div class="card">
    <div><b>Шаг 1:</b> Выберите ваш большой файл (.js)</div>
    <input type="file" id="fileIn" accept=".js,.txt" style="margin-top:8px;width:100%">
    <div id="fileInfo" style="margin-top:6px;font-size:12px;color:#8b949e">Файл не загружен</div>
  </div>

  <div class="card">
    <div><b>Шаг 2:</b> Вставьте патч-команду от ИИ</div>
    <textarea id="patchIn" placeholder="Вставьте сюда JSON-патч..."></textarea>
    <button class="btn green" id="btnApply" disabled>⚡ Применить патч и скачать файл</button>
    <div id="log" style="margin-top:10px;font-size:13px;line-height:1.4"></div>
  </div>

<script>
let fileText = '', fileName = 'ZOPA.JS';

document.getElementById('fileIn').onchange = e => {
  const f = e.target.files.item(0);
  if (!f) return;
  fileName = f.name;
  const r = new FileReader();
  r.onload = ev => {
    fileText = ev.target.result;
    document.getElementById('fileInfo').innerHTML = `<span class="ok">✅ Загружен: ${fileName} (${fileText.split('\n').length} строк)</span>`;
    document.getElementById('btnApply').disabled = false;
  };
  r.readAsText(f, 'UTF-8');
};

document.getElementById('btnApply').onclick = () => {
  const log = document.getElementById('log');
  let ops;
  try {
    ops = JSON.parse(document.getElementById('patchIn').value.trim());
    if (!Array.isArray(ops)) ops = [ops];
  } catch (e) {
    log.innerHTML = `<span class="err">❌ Ошибка в формате патча: ${e.message}</span>`;
    return;
  }

  let res = fileText;
  let report = [];

  for (let i = 0; i < ops.length; i++) {
    const op = ops.at(i);
    if (op.act === 'replace') {
      if (!res.includes(op.find)) {
        log.innerHTML = `<span class="err">❌ Шаг ${i+1}: не найден фрагмент для замены. Патч остановлен.</span>`;
        return;
      }
      res = res.replace(op.find, op.to);
      report.push(`✔ Заменен блок (${op.desc || i+1})`);
    } 
    else if (op.act === 'cut_from') {
      const idx = res.indexOf(op.marker);
      if (idx === -1) {
        log.innerHTML = `<span class="err">❌ Шаг ${i+1}: не найдена метка обрезки.</span>`;
        return;
      }
      res = res.slice(0, idx);
      report.push(`✔ Обрезан мусорный хвост (${op.desc || i+1})`);
    }
    else if (op.act === 'cut_between') {
      const s = res.indexOf(op.start);
      const e = res.indexOf(op.end, s);
      if (s === -1 || e === -1) {
        log.innerHTML = `<span class="err">❌ Шаг ${i+1}: не найдены границы вырезки.</span>`;
        return;
      }
      res = res.slice(0, s) + (op.insert || '') + res.slice(e);
      report.push(`✔ Вырезан битый кусок (${op.desc || i+1})`);
    }
  }

  try {
    new Function(res);
  } catch (err) {
    log.innerHTML = report.join('<br>') + `<br><span class="err">⚠️ После патча в файле осталась ошибка JS: ${err.message}</span>`;
    return;
  }

  const blob = new Blob([res], { type: 'application/javascript;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName.replace(/\.js$/i, '') + '_fixed.js';
  a.click();

  log.innerHTML = report.join('<br>') + `<br><span class="ok">🎉 ГОТОВО! Синтаксис проверен, файл скачан!</span>`;
};
</script>
</body>
</html>
